<!-- Modelo do EmailJS (template_rfrabpi) em versão de código.
     Use se, no Gmail, as respostas aparecerem todas numa linha só:
     Email Templates > template_rfrabpi > Content > Edit Content > Code Editor > cole este conteúdo > Save.
     As variáveis são as mesmas do seu modelo: {{empresa}}, {{responsavel}}, {{respostas}} e {{data}}. -->
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #1b2233; line-height: 1.55;">
  <p style="margin: 0 0 14px;"><strong>NOVO DIAGNÓSTICO - PROJETO GÊNESIS</strong></p>
  <p style="margin: 0 0 14px;">Empresa: {{empresa}}<br>Responsável: {{responsavel}}</p>
  <p style="margin: 0 0 6px;"><strong>RESULTADOS:</strong></p>
  <div style="white-space: pre-line; margin: 0 0 14px;">{{respostas}}</div>
  <p style="margin: 0;">Data: {{data}}</p>
</div>

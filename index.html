<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROJECT_CITY</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="start-overlay">
      <div class="card">
        <h1>PROJECT_CITY</h1>
        <p id="start-status">Construindo a cidade…</p>
        <ul>
          <li><b>WASD</b> mover · <b>Shift</b> correr · <b>Espaço</b> pular · <b>Mouse</b> olhar</li>
          <li><b>1</b> pistola · <b>2</b> fuzil · <b>Botão esquerdo</b> atirar · <b>Botão direito</b> mirar · <b>R</b> recarregar</li>
          <li><b>F</b> entrar, sair ou roubar um carro · <b>Espaço</b> freio de mão · <b>H</b> buzina (no carro) / ajuda (a pé) · <b>Esc</b> soltar o mouse</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

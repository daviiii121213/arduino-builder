    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Cronos Jurássico - um RPG 2D top-down em pixel art sobre uma viagem no tempo até a era dos dinossauros." />
    <title>Cronos Jurássico</title>
    <!-- o ícone real é gerado pelo próprio jogo, a partir do sprite do coração -->

      <div id="stage">

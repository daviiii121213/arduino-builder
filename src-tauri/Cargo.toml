[package]
name = "personal-life-ultra"
version = "1.0.0"
description = "PERSONAL LIFE ULTRA - organização pessoal e familiar offline"
edition = "2021"
license = "MIT"

[lib]
name = "plu_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
plu-core = { path = "../crates/plu-core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooting Range</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <div class="panel">
      <h1>Shooting Range</h1>
      <p id="status">Carregando cenário… <span id="progress">0%</span></p>
      <p class="hint">Clique para jogar</p>
      <ul>
        <li><b>W A S D</b> mover</li>
        <li><b>Mouse</b> olhar em volta</li>
        <li><b>Shift</b> correr</li>
        <li><b>Esc</b> soltar o mouse</li>
      </ul>
    </div>
  </div>
  <div id="crosshair"></div>
  <script type="module" src="main.js"></script>
</body>
</html>

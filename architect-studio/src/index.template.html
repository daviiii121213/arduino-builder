<title>Architect Studio Ultra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*__CSS__*/
</style>

<div class="app">
  <header class="topbar">
    <div class="brand" aria-label="Architect Studio Ultra">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12h-7v-7h-4v7z"/><path d="M3 21h18" /></svg>
      <span class="bname">Architect Studio <b>Ultra</b></span>
    </div>
    <input id="projName" class="projname" aria-label="Nome do projeto" spellcheck="false">
    <span id="saveState" class="chip" role="status">—</span>
    <div class="tb-group">
      <button id="btnUndo" class="ibtn" aria-label="Desfazer"></button>
      <button id="btnRedo" class="ibtn" aria-label="Refazer"></button>
    </div>
    <div class="vm seg" role="group" aria-label="Modo de visualização">
      <button data-vm="plan" title="Somente planta (1)">Planta</button>
      <button data-vm="split" title="Planta + 3D (2)">Dividida</button>
      <button data-vm="3d" title="Somente 3D (3)">3D</button>
    </div>
    <div class="tb-right">
      <button id="btnSave" class="btn sm"></button>
      <button id="btnExport" class="btn sm primary"></button>
      <button id="btnTheme" class="ibtn" aria-label="Alternar tema"></button>
      <button id="btnHelp" class="ibtn" aria-label="Atalhos"></button>
      <button id="btnProps" class="ibtn only-mobile" aria-label="Propriedades"></button>
    </div>
  </header>

  <nav id="rail" class="rail" aria-label="Navegação principal"></nav>

  <aside id="leftPanel" class="panel" hidden aria-labelledby="panelTitle">
    <div class="ph"><h3 id="panelTitle">—</h3><button id="panelClose" class="ibtn" aria-label="Fechar painel"></button></div>
    <div id="panelBody" class="pbody"></div>
  </aside>

  <main class="workspace">
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Ferramentas de desenho"></div>
    <div class="views">
      <section class="view2d" aria-label="Planta baixa">
        <canvas id="plan" tabindex="0" aria-label="Área de desenho da planta"></canvas>
        <div id="zoomCtl" class="zoomctl"></div>
        <div class="vlabel">PLANTA</div>
        <div id="numInput" class="numinput" hidden>
          <label for="numInputField">Comprimento</label>
          <input id="numInputField" class="inp mono" inputmode="decimal" autocomplete="off"><span id="numInputUnit">m</span>
          <button id="numInputOk" class="btn sm primary">OK</button>
        </div>
      </section>
      <section class="view3d" aria-label="Vista 3D">
        <div id="v3" class="v3"></div>
        <div id="v3bar" class="v3bar"></div>
        <div class="vlabel">3D</div>
      </section>
    </div>
  </main>

  <aside id="props" class="props" aria-labelledby="propsTitle">
    <div class="ph"><h3 id="propsTitle">Propriedades</h3><button id="propsClose" class="ibtn only-mobile" aria-label="Fechar propriedades"></button></div>
    <div id="propsBody" class="pbody"></div>
  </aside>

  <footer class="status">
    <div id="floorTabs" class="floortabs"></div>
    <span id="stTool" class="st-tool"></span>
    <span id="stPos" class="mono st-pos">X — · Y —</span>
    <span id="stZoom" class="mono st-zoom">100%</span>
    <div id="snapToggles" class="snaps" aria-label="Snaps"></div>
    <span id="hint" class="hint"></span>
    <span id="stMetrics" class="mono st-met"></span>
  </footer>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="mbox"><div class="mh"><h3 id="modalTitle"></h3><button id="modalClose" class="ibtn" aria-label="Fechar"></button></div><div id="modalBody" class="mb"></div><div id="modalFoot" class="mf"></div></div>
</div>
<div id="ctxmenu" class="ctxmenu" hidden role="menu"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/*__JS__*/
</script>

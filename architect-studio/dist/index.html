<title>Architect Studio Ultra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: estação de trabalho em grade — barra superior, trilho de navegação, painel lateral, área de desenho (planta | 3D), propriedades, barra de status.
   Paleta "mesa de desenho": neutros frios levemente azulados, tinta cobalto como acento e laranja de segurança para seleção. */
:root {
  --bg: #eef0f2; --chrome: #f8f9fa; --chrome-2: #f1f3f5; --line: #dadee3; --line-2: #c7ccd3;
  --fg: #1b1f26; --muted: #5d6573; --faint: #8a919d;
  --accent: #2747c9; --accent-ink: #ffffff; --accent-soft: #e5eafb;
  --sel: #e2580e; --warn: #b26b00; --warn-soft: #fdf3e2; --ok: #1f7a4d; --ok-soft: #e4f3ea; --err: #c0392b; --err-soft: #fbe9e7;
  --canvas: #fbfcfd; --grid: #e9edf2; --grid-major: #d5dbe3; --wall: #23272f; --wall-fill: #50565f; --ink: #23272f; --dim: #4b5466; --room-label: #1f232b; --furn: #ffffff;
  --shadow: 0 1px 2px rgba(20, 26, 40, .06), 0 6px 20px rgba(20, 26, 40, .08);
  --f-display: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --chrome: #181c21; --chrome-2: #1e2329; --line: #2b3139; --line-2: #3a414b;
  --fg: #e7eaee; --muted: #a0a8b4; --faint: #737b87;
  --accent: #7d97ff; --accent-ink: #0e1220; --accent-soft: #232c4a;
  --sel: #ff8a3d; --warn: #f0b04a; --warn-soft: #3a2d17; --ok: #5cc98f; --ok-soft: #173326; --err: #ff7a6b; --err-soft: #3d1e1a;
  --canvas: #1a1e23; --grid: #22272d; --grid-major: #2d333b; --wall: #e3e6ea; --wall-fill: #a6adb7; --ink: #dfe3e8; --dim: #a9b3c4; --room-label: #eef1f4; --furn: #232830;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111418; --chrome: #181c21; --chrome-2: #1e2329; --line: #2b3139; --line-2: #3a414b;
  --fg: #e7eaee; --muted: #a0a8b4; --faint: #737b87;
  --accent: #7d97ff; --accent-ink: #0e1220; --accent-soft: #232c4a;
  --sel: #ff8a3d; --warn: #f0b04a; --warn-soft: #3a2d17; --ok: #5cc98f; --ok-soft: #173326; --err: #ff7a6b; --err-soft: #3d1e1a;
  --canvas: #1a1e23; --grid: #22272d; --grid-major: #2d333b; --wall: #e3e6ea; --wall-fill: #a6adb7; --ink: #dfe3e8; --dim: #a9b3c4; --room-label: #eef1f4; --furn: #232830;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.lg { width: 30px; height: 30px; }
kbd { font: 500 10.5px var(--f-mono); padding: 1px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--chrome); color: var(--muted); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- grade principal ---------- */
.app {
  height: 100%; display: grid;
  grid-template-columns: 76px auto minmax(0, 1fr) 300px;
  grid-template-rows: 50px minmax(0, 1fr) 30px;
  grid-template-areas: "top top top top" "rail panel work props" "status status status status";
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.topbar { grid-area: top; display: flex; align-items: center; gap: 10px; padding-inline: 12px; background: var(--chrome); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.logo { width: 24px; height: 24px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round; }
.bname { font: 600 14px var(--f-display); letter-spacing: -.01em; white-space: nowrap; }
.bname b { color: var(--accent); font-weight: 700; }
.projname { min-width: 80px; max-width: 360px; flex: 1 1 220px; border: 1px solid transparent; background: transparent; border-radius: var(--r); padding: 5px 8px; font: 500 13px var(--f-ui); text-overflow: ellipsis; }
.projname:hover { border-color: var(--line); }
.projname:focus { border-color: var(--accent); background: var(--canvas); outline: none; }
.chip { font-size: 11px; color: var(--muted); padding: 2px 8px; border-radius: 999px; background: var(--chrome-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.tb-group { display: flex; gap: 2px; }
.tb-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; background: var(--chrome-2); border: 1px solid var(--line); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--canvas); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--chrome); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .12s, border-color .12s; text-decoration: none; }
.btn:hover { background: var(--chrome-2); border-color: var(--faint); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); }
.btn.danger:hover { background: var(--err-soft); border-color: var(--err); }
.btn.block { width: 100%; white-space: normal; text-align: center; }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn.file { position: relative; }
.btn .ic { width: 15px; height: 15px; }
.ibtn { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 1px solid transparent; background: transparent; border-radius: var(--r); cursor: pointer; color: var(--muted); padding: 0; font-size: 11px; }
.ibtn:hover:not(:disabled) { background: var(--chrome-2); color: var(--fg); border-color: var(--line); }
.ibtn:disabled { opacity: .35; cursor: default; }
.ibtn.danger:hover { color: var(--err); }
.only-mobile { display: none !important; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.link:hover { text-decoration: underline; }

/* ---------- trilho ---------- */
.rail { grid-area: rail; background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; overflow-y: auto; scrollbar-width: none; }
.rail button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: transparent; padding: 7px 2px; border-radius: var(--r); cursor: pointer; color: var(--muted); font-size: 10px; line-height: 1.15; text-align: center; }
.rail button span { max-width: 66px; }
.rail button:hover { background: var(--chrome-2); color: var(--fg); }
.rail button.on { background: var(--accent-soft); color: var(--accent); }
.rail button[data-panel="import"] { position: relative; }

/* ---------- painéis ---------- */
.panel, .props { background: var(--chrome); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel { grid-area: panel; width: 330px; border-right: 1px solid var(--line); }
.props { grid-area: props; border-left: 1px solid var(--line); }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px 14px; border-bottom: 1px solid var(--line); }
.ph h3 { margin: 0; font: 600 13px var(--f-display); letter-spacing: .01em; text-transform: uppercase; color: var(--fg); }
.pbody { overflow-y: auto; padding: 4px 0 24px; min-height: 0; flex: 1; }
.sec { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.sec + .sec { border-top: 1px solid var(--line); }
.sec h4 { margin: 0; font: 600 10.5px var(--f-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mtext { margin: 0; color: var(--muted); font-size: 12.5px; text-wrap: pretty; }
.muted { color: var(--faint); font-size: 12px; margin: 0; }
.empty-tip { color: var(--faint); font-size: 12px; padding: 4px 14px; margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid2 .wide { grid-column: 1 / -1; }
.btnrow { flex-direction: row; flex-wrap: wrap; gap: 6px; }
.sec.btnrow { display: flex; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fl { font-size: 11px; color: var(--muted); }
.fld.ro { flex-direction: row; justify-content: space-between; }
.fld.ro .val { font-size: 12px; }
.inp { width: 100%; border: 1px solid var(--line-2); background: var(--canvas); border-radius: 5px; padding: 5px 7px; min-width: 0; font-size: 12.5px; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.inp { resize: vertical; }
.inp.color { padding: 2px; height: 30px; cursor: pointer; }
.inp-u { display: flex; align-items: stretch; }
.inp-u .inp { border-radius: 5px 0 0 5px; }
.inp-u i { font: 500 11px var(--f-mono); font-style: normal; display: grid; place-items: center; padding: 0 6px; border: 1px solid var(--line-2); border-left: 0; border-radius: 0 5px 5px 0; background: var(--chrome-2); color: var(--muted); min-width: 28px; }
.mat-sel { display: flex; gap: 6px; align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, .15); flex: none; vertical-align: -2px; margin-right: 6px; }
.mat-sel .sw { margin: 0; width: 22px; height: 22px; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 12.5px; }
.chk input { accent-color: var(--accent); }
.chks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
.kv span { color: var(--muted); }
.kv b { font-weight: 500; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.notes { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
.callout { flex-direction: row; gap: 10px; align-items: flex-start; font-size: 12.5px; border-radius: var(--r); margin: 8px 12px; padding: 10px 12px; }
.callout.warn { background: var(--warn-soft); color: var(--fg); }
.callout.warn .ic { color: var(--warn); }
.callout.ok { background: var(--ok-soft); }
.callout.ok .ic { color: var(--ok); }
.sec.callout + .sec { border-top: 0; }
p.callout { display: flex; margin: 8px 0; }
.unc { color: var(--warn); font-style: normal; font-size: 11px; font-weight: 600; }
.okc { color: var(--ok); font-style: normal; font-size: 11px; font-weight: 600; }
.ok-line { color: var(--ok); display: flex; gap: 6px; align-items: center; margin: 4px 0 0; }
.err-line { color: var(--err); margin: 4px 0 0; }
.issues { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 4px; font-size: 12px; max-height: 240px; overflow: auto; }
.issues li { padding-left: 8px; border-left: 3px solid var(--line-2); }
.issues .lv-erro { border-color: var(--err); }
.issues .lv-aviso { border-color: var(--warn); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: var(--chrome-2); }
.tbl tr.cur { background: var(--accent-soft); }
.tbl tfoot td { font-weight: 600; border-bottom: 0; }
.tbl .r { text-align: right; white-space: nowrap; }
.list { display: grid; gap: 6px; }
.li { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--canvas); }
.li.cur { border-color: var(--accent); }
.li-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li-main b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-main small { color: var(--faint); font-size: 11px; }
.li-act { display: flex; gap: 2px; }
.li-act .ibtn { width: auto; padding: 0 6px; font-size: 11.5px; }
.steps { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); font-size: 12.5px; }
.steps.sm { font-size: 12px; }
.steps b { color: var(--fg); font-weight: 600; }

/* importação */
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 12px; border: 1.5px dashed var(--line-2); border-radius: 8px; cursor: pointer; text-align: center; background: var(--canvas); color: var(--muted); transition: border-color .12s, background .12s; }
.drop b { color: var(--fg); font-weight: 600; }
.drop span { font-size: 11.5px; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.pg { display: flex; flex-direction: column; gap: 3px; padding: 5px; border: 1px solid var(--line); border-radius: var(--r); background: var(--canvas); cursor: pointer; text-align: left; font-size: 11px; }
.pg img { width: 100%; aspect-ratio: 1.3; object-fit: contain; background: #fff; border-radius: 3px; }
.pg small { color: var(--faint); font-size: 10px; }
.pg.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.txt-found summary { cursor: pointer; font-size: 12px; color: var(--fg); }
.txt-found p { margin: 6px 0 0; overflow-wrap: anywhere; }
input[type=range] { accent-color: var(--accent); width: 100%; }

/* mobiliário e materiais */
.fu-grid, .mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
.fu, .mat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border: 1px solid var(--line); border-radius: var(--r); background: var(--canvas); cursor: pointer; font-size: 11px; text-align: center; line-height: 1.2; }
.fu:hover, .mat:hover { border-color: var(--accent); }
.fu canvas { width: 64px; height: 48px; }
.fu small { color: var(--faint); font-size: 10px; }
.sw-lg { width: 100%; height: 34px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .12); display: block; margin-bottom: 3px; }
.pat-wood { background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 7px) !important; }
.pat-tile { background-image: linear-gradient(rgba(0,0,0,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.14) 1px, transparent 1px) !important; background-size: 12px 12px !important; }
.pat-brick { background-image: linear-gradient(rgba(0,0,0,.14) 1px, transparent 1px) !important; background-size: 100% 6px !important; }
.pat-marble { background-image: linear-gradient(115deg, transparent 40%, rgba(0,0,0,.12) 42%, transparent 45%) !important; }
.pat-glass { opacity: .7; }

/* exportação */
.exp-list { display: grid; gap: 6px; }
.exp { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--canvas); cursor: pointer; }
.exp b { font-weight: 600; }
.exp span { color: var(--muted); font-size: 12px; }
.exp:hover { border-color: var(--accent); }
.exp.busy { opacity: .55; pointer-events: none; }
.exp-prev { max-height: 50vh; display: block; margin: 8px auto; border: 1px solid var(--line); background: #fff; }
.exp-txt { height: 40vh; font-size: 11px; }
.hist { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 12px; }
.hist li { display: flex; justify-content: space-between; gap: 8px; }
.hist small { color: var(--faint); }
.hist.redo { color: var(--faint); }

/* gerador */
.alts { display: grid; gap: 10px; }
.alt { display: flex; flex-direction: column; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--canvas); }
.alt canvas { width: 100%; height: auto; background: #fff; border-radius: 4px; border: 1px solid var(--line); }
.alt small { color: var(--muted); font-size: 11px; }

/* ---------- área de trabalho ---------- */
.workspace { grid-area: work; display: grid; grid-template-columns: 46px minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; background: var(--chrome); border-right: 1px solid var(--line); align-items: center; overflow-y: auto; scrollbar-width: none; }
.toolbar button { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: var(--r); cursor: pointer; color: var(--muted); padding: 0; flex: none; }
.toolbar button:hover { background: var(--chrome-2); color: var(--fg); }
.toolbar button.on { background: var(--accent); color: var(--accent-ink); }
.toolbar button kbd { position: absolute; right: 1px; bottom: 0; border: 0; background: none; padding: 0; font-size: 8.5px; color: inherit; opacity: .6; }
.toolbar .ic { width: 20px; height: 20px; }
.tsep { width: 24px; height: 1px; background: var(--line); margin: 4px 0; flex: none; }
.views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-width: 0; min-height: 0; gap: 1px; background: var(--line); }
body[data-view="plan"] .views { grid-template-columns: minmax(0, 1fr); }
body[data-view="plan"] .view3d { display: none; }
body[data-view="3d"] .views { grid-template-columns: minmax(0, 1fr); }
body[data-view="3d"] .view2d { display: none; }
.view2d, .view3d { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); }
#plan { display: block; touch-action: none; outline: none; }
.v3 { position: absolute; inset: 0; }
.v3 canvas { display: block; touch-action: none; outline: none; }
.v3-empty { display: grid; place-content: center; gap: 6px; height: 100%; text-align: center; padding: 24px; color: var(--muted); }
.v3-empty b { color: var(--fg); }
.vlabel { position: absolute; left: 10px; top: 8px; font: 600 10px var(--f-display); letter-spacing: .14em; color: var(--faint); pointer-events: none; }
.zoomctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; background: var(--chrome); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.zoomctl button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
.zoomctl button + button { border-top: 1px solid var(--line); }
.zoomctl button:hover { color: var(--fg); background: var(--chrome-2); }
.v3bar { position: absolute; left: 50%; transform: translateX(-50%); top: 8px; display: flex; gap: 6px; align-items: center; background: var(--chrome); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; box-shadow: var(--shadow); max-width: calc(100% - 16px); overflow-x: auto; scrollbar-width: none; }
.v3bar > button { border: 1px solid var(--line); background: var(--canvas); border-radius: 5px; height: 26px; padding: 0 8px; cursor: pointer; display: grid; place-items: center; font-size: 11.5px; color: var(--muted); }
.v3bar > button:hover { color: var(--fg); }
.v3bar .seg button { padding: 2px 8px; font-size: 11.5px; }
.tg { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tg input { accent-color: var(--accent); margin: 0; }
.numinput { position: absolute; z-index: 5; display: flex; align-items: center; gap: 6px; background: var(--chrome); border: 1px solid var(--accent); border-radius: var(--r); padding: 6px 8px; box-shadow: var(--shadow); font-size: 11px; color: var(--muted); }
.numinput .inp { width: 80px; }

/* ---------- status ---------- */
.status { grid-area: status; display: flex; align-items: center; gap: 14px; padding-inline: 8px 12px; background: var(--chrome); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; padding-bottom: env(safe-area-inset-bottom, 0px); }
.floortabs { display: flex; gap: 2px; flex: none; }

/* ---- 00-util.js ---- */
'use strict';
/* ==========================================================================
   00 — Utilitários e geometria
   Unidade interna: centímetros (cm). Eixo Y da planta cresce para "baixo".
   ========================================================================== */

const AS = window.AS = {};

AS.uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
AS.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
AS.round = (v, step = 1) => Math.round(v / step) * step;

const G = AS.geo = {
  EPS: 1e-6,
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  mul: (a, s) => ({ x: a.x * s, y: a.y * s }),
  dot: (a, b) => a.x * b.x + a.y * b.y,
  cross: (a, b) => a.x * b.y - a.y * b.x,
  len: (a) => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  norm(a) { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },
  perp: (a) => ({ x: -a.y, y: a.x }),
  lerp: (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }),
  eq: (a, b, tol = 0.5) => Math.abs(a.x - b.x) <= tol && Math.abs(a.y - b.y) <= tol,
  rot(p, ang, c = { x: 0, y: 0 }) {
    const s = Math.sin(ang), co = Math.cos(ang), dx = p.x - c.x, dy = p.y - c.y;
    return { x: c.x + dx * co - dy * s, y: c.y + dx * s + dy * co };
  },
  /** Projeção de p no segmento ab: {t (0..1), d (distância), p (ponto)} */
  projSeg(p, a, b) {
    const ab = G.sub(b, a), l2 = G.dot(ab, ab);
    let t = l2 ? G.dot(G.sub(p, a), ab) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const q = { x: a.x + ab.x * t, y: a.y + ab.y * t };
    return { t, d: G.dist(p, q), p: q };
  },
  /** Projeção na reta infinita */
  projLine(p, a, b) {
    const ab = G.sub(b, a), l2 = G.dot(ab, ab) || 1;
    const t = G.dot(G.sub(p, a), ab) / l2;
    return { t, p: { x: a.x + ab.x * t, y: a.y + ab.y * t } };
  },
  /** Interseção de segmentos; retorna {p,t,u} ou null */
  segInter(a, b, c, d) {
    const r = G.sub(b, a), s = G.sub(d, c), den = G.cross(r, s);
    if (Math.abs(den) < 1e-9) return null;
    const ca = G.sub(c, a), t = G.cross(ca, s) / den, u = G.cross(ca, r) / den;
    if (t < -1e-9 || t > 1 + 1e-9 || u < -1e-9 || u > 1 + 1e-9) return null;
    return { p: { x: a.x + r.x * t, y: a.y + r.y * t }, t, u };
  },
  /** Interseção de retas infinitas */
  lineInter(a, b, c, d) {
    const r = G.sub(b, a), s = G.sub(d, c), den = G.cross(r, s);
    if (Math.abs(den) < 1e-9) return null;
    const t = G.cross(G.sub(c, a), s) / den;

  },
  areaSigned(poly) {
    let s = 0;
    for (let i = 0, n = poly.length; i < n; i++) { const a = poly[i], b = poly[(i + 1) % n]; s += a.x * b.y - b.x * a.y; }
    return s / 2;
  },
  area: (poly) => Math.abs(G.areaSigned(poly)),
  perimeter(poly) { let s = 0; for (let i = 0; i < poly.length; i++) s += G.dist(poly[i], poly[(i + 1) % poly.length]); return s; },
  centroid(poly) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0, n = poly.length; i < n; i++) {

  },
  bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y; }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  },
  inPoly(p, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if (((a.y > p.y) !== (b.y > p.y)) && (p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x)) c = !c;
    }
    return c;
  },
  /** Ponto interno "bom" para rótulo: centróide se interno, senão varredura */
  labelPoint(poly) {
    const c = G.centroid(poly);
    if (G.inPoly(c, poly)) return c;
    const b = G.bbox(poly); let best = null, bestD = -1;
    for (let i = 1; i < 12; i++) for (let j = 1; j < 12; j++) {
      const p = { x: b.x0 + b.w * i / 12, y: b.y0 + b.h * j / 12 };
      if (!G.inPoly(p, poly)) continue;
      let d = Infinity;
      for (let k = 0; k < poly.length; k++) d = Math.min(d, G.projSeg(p, poly[k], poly[(k + 1) % poly.length]).d);
      if (d > bestD) { bestD = d; best = p; }
    }
    return best || c;
  },
  /** Polígono deslocado para dentro; offs[i] = recuo da aresta i (poly[i]->poly[i+1]) */
  insetPoly(poly, offs) {
    const n = poly.length; if (n < 3) return poly.slice();
    const ccw = G.areaSigned(poly) > 0; // em coords y-baixo, "ccw" matemático
    const lines = [];
    for (let i = 0; i < n; i++) {
      const a = poly[i], b = poly[(i + 1) % n], d = G.norm(G.sub(b, a));

      const o = offs[i] || 0;
      lines.push([G.add(a, G.mul(nrm, o)), G.add(b, G.mul(nrm, o))]);
    }
    const out = [];
    for (let i = 0; i < n; i++) {
      const L0 = lines[(i - 1 + n) % n], L1 = lines[i];
      const p = G.lineInter(L0[0], L0[1], L1[0], L1[1]);

    if (Math.sign(a0) !== Math.sign(a1) || Math.abs(a1) > Math.abs(a0)) return poly.slice();
    return out;
  },
  simplify(poly, tol = 0.5) {
    // remove vértices colineares e duplicados
    let pts = poly.filter((p, i) => !G.eq(p, poly[(i + 1) % poly.length], 0.01));
    let changed = true;
    while (changed && pts.length > 3) {
      changed = false;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[(i - 1 + pts.length) % pts.length], b = pts[i], c = pts[(i + 1) % pts.length];
        const ab = G.sub(b, a), bc = G.sub(c, b);
        if (Math.abs(G.cross(G.norm(ab), G.norm(bc))) < 1e-4 && G.dot(ab, bc) > 0) { pts.splice(i, 1); changed = true; break; }
      }
    }
    return pts;
  },
};

/* ---------- Unidades ---------- */
AS.units = {
  mode: 'm', precision: 2,
  fmt(cm, mode = AS.units.mode, prec = AS.units.precision) {
    if (cm == null || !isFinite(cm)) return '—';
    let v, u;
    if (mode === 'mm') { v = cm * 10; u = 'mm'; prec = Math.max(0, prec - 2); }
    else if (mode === 'cm') { v = cm; u = 'cm'; prec = Math.max(0, prec - 2); }
    else { v = cm / 100; u = 'm'; }
    return v.toLocaleString('pt-BR', { minimumFractionDigits: prec, maximumFractionDigits: prec }) + ' ' + u;
  },
  fmtNum(cm, mode = AS.units.mode) { // número sem unidade, para campos
    const v = mode === 'mm' ? cm * 10 : mode === 'cm' ? cm : cm / 100;
    const p = mode === 'm' ? 3 : mode === 'cm' ? 1 : 0;
    return String(+v.toFixed(p)).replace('.', ',');
  },
  fmtArea(cm2) {
    return (cm2 / 10000).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m²';
  },
  /** Aceita "3,5", "3.5m", "350cm", "3500 mm", "3m50". Sem unidade: unidade atual. */
  parse(str, mode = AS.units.mode) {
    if (str == null) return NaN;
    let s = String(str).trim().toLowerCase().replace(/\s+/g, '');
    if (!s) return NaN;
    let m = s.match(/^(\d+)m(\d{1,2})$/); // 3m50
    if (m) return (+m[1]) * 100 + (+m[2].padEnd(2, '0'));
    m = s.match(/^(-?[\d.,]+)(mm|cm|m)?$/);
    if (!m) return NaN;
    let num = m[1];
    if (num.includes(',') && num.includes('.')) num = num.replace(/\./g, '').replace(',', '.');
    else num = num.replace(',', '.');
    const v = parseFloat(num); if (!isFinite(v)) return NaN;
    const u = m[2] || mode;
    return u === 'mm' ? v / 10 : u === 'cm' ? v : v * 100;
  },
  label() { return AS.units.mode; },
};

/* ---------- Eventos simples ---------- */
AS.bus = {
  h: {},
  on(ev, fn) { (this.h[ev] ||= []).push(fn); },
  emit(ev, ...a) { (this.h[ev] || []).forEach(f => { try { f(...a); } catch (e) { console.error(ev, e); } }); },

AS.throttle = (fn, ms) => {
  let last = 0, t = null;
  return (...a) => {
    const now = performance.now();
    if (now - last >= ms) { last = now; fn(...a); }
    else { clearTimeout(t); t = setTimeout(() => { last = performance.now(); fn(...a); }, ms - (now - last)); }

};
AS.fmtDate = (ts) => ts ? new Date(ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

/* ==========================================================================

AS.ROOM_TYPES = [
  { id: 'sala', name: 'Sala de estar', color: '#e9dcc6', floor: 'porc_bege' },

AS.newFloor = (name = 'Térreo', elevation = 0) => ({

    settings: { wallThickness: 15, extThickness: 20, wallHeight: 280, grid: 10, snapGrid: true, snapWall: true, snapCorner: true, snapAlign: true, angleSnap: true, showDims: true, showGrid: true, showFurniture: true, showLower: false, roomAreaMode: 'util' },
    view3d: { ceilings: false, cutaway: false, allFloors: true, shadows: true, roof: false },
    meta: { source: 'manual', notes: '' },
  };
};

/* ---------- Estado global ---------- */
AS.state = {
  project: null,
  sel: [],            // [{kind:'wall'|'opening'|'furniture'|'room'|'dim', id}]
  tool: 'select',
  viewMode: 'split',
  clipboard: null,
  version: 0,         // incrementa a cada alteração de geometria
};
const S = AS.state;

AS.floor = () => S.project.floors.find(f => f.id === S.project.activeFloor) || S.project.floors[0];
AS.floorById = (id) => S.project.floors.find(f => f.id === id);
AS.mat = (id) => S.project.materials.find(m => m.id === id) || AS.DEFAULT_MATERIALS.find(m => m.id === id) || AS.DEFAULT_MATERIALS[0];
AS.find = (kind, id, fl = AS.floor()) => {
  const list = kind === 'wall' ? fl.walls : kind === 'opening' ? fl.openings : kind === 'furniture' ? fl.furniture : kind === 'room' ? fl.roomMeta : kind === 'dim' ? fl.dims : [];
  return list.find(o => o.id === id);
};
AS.wallLen = (w) => G2.dist(w.a, w.b);
AS.wallDir = (w) => G2.norm(G2.sub(w.b, w.a));

/* ---------- Histórico (opera sobre os dados reais do projeto) ---------- */
AS.history = {
  undo: [], redo: [], max: 120, pending: null,
  snap() { const p = S.project; return JSON.stringify({ floors: p.floors, materials: p.materials, activeFloor: p.activeFloor, settings: p.settings, name: p.name, view3d: p.view3d }); },
  restore(str) {
    const d = JSON.parse(str); Object.assign(S.project, d);
    S.sel = S.sel.filter(s => AS.find(s.kind, s.id));
    AS.changed(true);
  },
  begin() { if (!this.pending) this.pending = this.snap(); },
  cancel() { if (this.pending) { this.restore(this.pending); this.pending = null; } },
  commit(label) {
    const before = this.pending ?? null; this.pending = null;
    if (before == null) return;
    const after = this.snap();
    if (before === after) return;
    this.undo.push({ label, data: before, ts: Date.now() });
    if (this.undo.length > this.max) this.undo.shift();
    this.redo = [];
    S.project.modified = Date.now();
    AS.changed(true);
    AS.bus.emit('history');
  },
  /** Executa fn como uma única operação desfazível */
  run(label, fn) { this.begin(); try { fn(); } catch (e) { console.error(e); this.cancel(); AS.toast('Erro: ' + e.message, 'err'); return; } this.commit(label); },
  doUndo() {
    const e = this.undo.pop(); if (!e) return AS.toast('Nada para desfazer');
    this.redo.push({ label: e.label, data: this.snap(), ts: Date.now() });
    this.restore(e.data); AS.toast('Desfeito: ' + e.label); AS.bus.emit('history');
  },
  doRedo() {
    const e = this.redo.pop(); if (!e) return AS.toast('Nada para refazer');
    this.undo.push({ label: e.label, data: this.snap(), ts: Date.now() });
    this.restore(e.data); AS.toast('Refeito: ' + e.label); AS.bus.emit('history');
  },
  jump(idx) { // volta ao estado antes da entrada idx
    while (this.undo.length > idx) { const e = this.undo.pop(); this.redo.push({ label: e.label, data: this.snap(), ts: Date.now() }); this.restore(e.data); }
    AS.bus.emit('history');
  },
  clear() { this.undo = []; this.redo = []; this.pending = null; AS.bus.emit('history'); },
};

/** Notifica alterações. geom=true invalida cômodos e cena 3D. */
AS.changed = (geom = true) => {
  if (geom) { S.version++; AS.roomsCache = null; }
  AS.bus.emit('changed', geom);
};

/* ---------- Operações de paredes ---------- */
AS.addWall = (a, b, opts = {}) => {
  const fl = opts.floor || AS.floor(), st = S.project?.settings || { wallThickness: 15, wallHeight: 280 };
  if (G2.dist(a, b) < 1) return null;
  const w = {
    id: AS.uid('w'), a: { x: a.x, y: a.y }, b: { x: b.x, y: b.y },
    thickness: opts.thickness ?? st.wallThickness, height: opts.height ?? fl.height ?? st.wallHeight,
    material: opts.material || 'pint_branca', materialExt: opts.materialExt || null,
    type: opts.type || 'interior', locked: false, hidden: false, groupId: null, note: opts.note || '',
  };
  fl.walls.push(w); return w;
};

/** Paredes conectadas a um ponto (extremidades coincidentes) */
AS.wallsAt = (p, fl = AS.floor(), tol = 1, exceptId = null) => {
  const r = [];
  for (const w of fl.walls) {
    if (w.id === exceptId) continue;
    if (G2.eq(w.a, p, tol)) r.push({ w, end: 'a' });
    if (G2.eq(w.b, p, tol)) r.push({ w, end: 'b' });
  }
  return r;
};

/** Mantém aberturas dentro da parede após mudanças */
AS.fixOpenings = (fl = AS.floor()) => {
  for (const o of fl.openings) {
    const w = fl.walls.find(x => x.id === o.wallId);
    if (!w) continue;
    const L = AS.wallLen(w);
    o.width = Math.min(o.width, Math.max(10, L - 2));
    o.t = AS.clamp(o.t, o.width / 2, Math.max(o.width / 2, L - o.width / 2));
  }
  fl.openings = fl.openings.filter(o => fl.walls.some(w => w.id === o.wallId));
};

/** Divide a parede no ponto (distância t em cm a partir de a). Aberturas são redistribuídas. */
AS.splitWall = (w, tcm, fl = AS.floor()) => {
  const L = AS.wallLen(w);
  if (tcm <= 1 || tcm >= L - 1) return null;
  const p = G2.lerp(w.a, w.b, tcm / L);
  const w2 = AS.clone(w); w2.id = AS.uid('w'); w2.a = { ...p }; w2.b = { ...w.b };
  w.b = { ...p };
  fl.walls.push(w2);
  for (const o of fl.openings) if (o.wallId === w.id && o.t > tcm) { o.wallId = w2.id; o.t -= tcm; }
  AS.fixOpenings(fl);
  return w2;
};

/** Une duas paredes colineares que compartilham uma extremidade */
AS.mergeWalls = (w1, w2, fl = AS.floor()) => {
  const d1 = AS.wallDir(w1), d2 = AS.wallDir(w2);
  if (Math.abs(G2.cross(d1, d2)) > 0.01) throw new Error('As paredes não são colineares');
  let shared = null;
  for (const e1 of ['a', 'b']) for (const e2 of ['a', 'b']) if (G2.eq(w1[e1], w2[e2], 1)) shared = [e1, e2];
  if (!shared) throw new Error('As paredes não compartilham uma extremidade');
  const far1 = shared[0] === 'a' ? w1.b : w1.a, far2 = shared[1] === 'a' ? w2.b : w2.a;
  // aberturas: recalcula t pela projeção
  const opens = fl.openings.filter(o => o.wallId === w1.id || o.wallId === w2.id).map(o => {
    const w = o.wallId === w1.id ? w1 : w2; const c = G2.lerp(w.a, w.b, o.t / AS.wallLen(w)); return { o, c };
  });
  w1.a = { ...far1 }; w1.b = { ...far2 };
  fl.walls = fl.walls.filter(w => w.id !== w2.id);
  for (const { o, c } of opens) { o.wallId = w1.id; o.t = G2.projSeg(c, w1.a, w1.b).t * AS.wallLen(w1); }
  AS.fixOpenings(fl);
};

/** Divide todas as paredes nos pontos de cruzamento / junção em T */
AS.splitAtIntersections = (fl = AS.floor()) => {
  let count = 0, guard = 0, changed = true;
  while (changed && guard++ < 50) {
    changed = false;
    outer: for (const w of fl.walls) {
      const L = AS.wallLen(w);
      for (const v of fl.walls) {
        if (v === w) continue;
        for (const p of [v.a, v.b]) { // junção em T
          const pr = G2.projSeg(p, w.a, w.b);
          if (pr.d < 1 && pr.t * L > 2 && pr.t * L < L - 2) { AS.splitWall(w, pr.t * L, fl); count++; changed = true; break outer; }
        }
        const x = G2.segInter(w.a, w.b, v.a, v.b);
        if (x && x.t * L > 2 && x.t * L < L - 2) {
          const Lv = AS.wallLen(v);
          if (x.u * Lv > 2 && x.u * Lv < Lv - 2) { AS.splitWall(w, x.t * L, fl); AS.splitWall(v, x.u * Lv, fl); count++; changed = true; break outer; }
        }
      }
    }
  }
  return count;
};

/* ---------- Validação geométrica ---------- */
AS.validate = (fl = AS.floor()) => {
  const issues = [];
  const W = fl.walls;
  for (const w of W) {
    const L = AS.wallLen(w);
    if (L < 2) issues.push({ level: 'erro', code: 'zero', msg: 'Parede com comprimento nulo ou quase nulo', ids: [w.id] });
    if (w.thickness <= 0 || w.height <= 0) issues.push({ level: 'erro', code: 'dim', msg: 'Parede com espessura ou altura inválida', ids: [w.id] });
  }
  // extremidades soltas e quase conectadas
  const ends = [];
  for (const w of W) for (const e of ['a', 'b']) ends.push({ w, e, p: w[e] });
  for (const E of ends) {
    const conn = ends.some(o => o !== E && G2.eq(o.p, E.p, 1));
    const onWall = W.some(v => v !== E.w && G2.projSeg(E.p, v.a, v.b).d < 1);
    if (!conn && !onWall) {
      const near = ends.find(o => o.w !== E.w && G2.dist(o.p, E.p) < 15);
      if (near) issues.push({ level: 'aviso', code: 'near', msg: `Extremidades quase conectadas (${AS.units.fmt(G2.dist(near.p, E.p))} de folga)`, ids: [E.w.id, near.w.id], fix: true });
      else issues.push({ level: 'info', code: 'free', msg: 'Extremidade de parede solta (não conectada)', ids: [E.w.id] });
    }
  }
  // sobreposição colinear
  for (let i = 0; i < W.length; i++) for (let j = i + 1; j < W.length; j++) {
    const a = W[i], b = W[j], da = AS.wallDir(a), db = AS.wallDir(b);
    if (Math.abs(G2.cross(da, db)) > 0.01) {
      const x = G2.segInter(a.a, a.b, b.a, b.b);
      if (x) {
        const La = AS.wallLen(a), Lb = AS.wallLen(b);
        const inA = x.t * La > 2 && x.t * La < La - 2, inB = x.u * Lb > 2 && x.u * Lb < Lb - 2;
        if (inA && inB) issues.push({ level: 'info', code: 'cross', msg: 'Paredes se cruzam sem junção (use "Dividir nas interseções" se desejar)', ids: [a.id, b.id] });
      }
      continue;
    }
    if (G2.projLine(b.a, a.a, a.b).p && G2.dist(G2.projLine(b.a, a.a, a.b).p, b.a) > 1) continue;
    const La = AS.wallLen(a), t0 = G2.projLine(b.a, a.a, a.b).t * La, t1 = G2.projLine(b.b, a.a, a.b).t * La;
    const ov = Math.min(La, Math.max(t0, t1)) - Math.max(0, Math.min(t0, t1));
    if (ov > 2) issues.push({ level: 'erro', code: 'overlap', msg: `Paredes sobrepostas (${AS.units.fmt(ov)})`, ids: [a.id, b.id], fix: true });
  }
  // aberturas
  for (const o of fl.openings) {
    const w = W.find(x => x.id === o.wallId);
    if (!w) { issues.push({ level: 'erro', code: 'orphan', msg: 'Abertura sem parede', ids: [o.id], fix: true }); continue; }
    if (o.height + (o.sill || 0) > w.height + 0.5) issues.push({ level: 'aviso', code: 'tall', msg: `${o.kind === 'door' ? 'Porta' : 'Janela'} mais alta que a parede`, ids: [o.id] });
    for (const p of fl.openings) if (p !== o && p.wallId === o.wallId && p.id > o.id && Math.abs(p.t - o.t) < (p.width + o.width) / 2 - 0.5)
      issues.push({ level: 'erro', code: 'opov', msg: 'Aberturas sobrepostas na mesma parede', ids: [o.id, p.id] });
  }
  return issues;
};

/** Correções automáticas seguras */
AS.autoFix = (fl = AS.floor()) => {
  let n = 0;
  const before = fl.walls.length;
  fl.walls = fl.walls.filter(w => AS.wallLen(w) >= 2); n += before - fl.walls.length;
  // une extremidades próximas (<15cm)
  const ends = []; for (const w of fl.walls) for (const e of ['a', 'b']) ends.push({ w, e });
  for (const E of ends) {
    const p = E.w[E.e];
    const connected = ends.some(o => o !== E && G2.eq(o.w[o.e], p, 1)) || fl.walls.some(v => v !== E.w && G2.projSeg(p, v.a, v.b).d < 1);
    if (connected) continue;
    let best = null, bd = 15;
    for (const o of ends) { if (o.w === E.w) continue; const d = G2.dist(o.w[o.e], p); if (d < bd) { bd = d; best = o; } }
    if (best) { E.w[E.e] = { ...best.w[best.e] }; n++; }
  }
  // remove duplicatas idênticas
  const seen = new Set();
  fl.walls = fl.walls.filter(w => {
    const k = [w.a, w.b].map(p => Math.round(p.x) + ',' + Math.round(p.y)).sort().join('|');
    if (seen.has(k)) { n++; return false; } seen.add(k); return true;
  });
  AS.fixOpenings(fl);
  return n;
};

/* ---------- Detecção de cômodos (faces mínimas do grafo planar) ---------- */
AS.detectRooms = (fl = AS.floor()) => {
  const walls = fl.walls.filter(w => !w.hidden && AS.wallLen(w) > 1);
  // 1. segmentos e pontos de quebra
  const segs = walls.map(w => ({ w, a: w.a, b: w.b, cuts: [0, 1] }));
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], L = G2.dist(s.a, s.b);
    for (let j = 0; j < segs.length; j++) {
      if (i === j) continue;
      const o = segs[j];
      if (j > i) { const x = G2.segInter(s.a, s.b, o.a, o.b); if (x) { s.cuts.push(x.t); o.cuts.push(x.u); } }
      for (const p of [o.a, o.b]) { const pr = G2.projSeg(p, s.a, s.b); if (pr.d < 1.5 && pr.t * L > 0.5 && pr.t * L < L - 0.5) s.cuts.push(pr.t); }
    }
  }
  // 2. nós (fundidos por tolerância) e arestas
  const nodes = [];
  const nodeAt = (p) => {
    for (let i = 0; i < nodes.length; i++) if (G2.dist(nodes[i], p) < 1.5) return i;
    nodes.push({ x: p.x, y: p.y, out: [] }); return nodes.length - 1;
  };
  const edgeSet = new Map();
  for (const s of segs) {
    const cuts = [...new Set(s.cuts.map(t => Math.round(t * 1e6) / 1e6))].sort((a, b) => a - b);
    for (let k = 0; k < cuts.length - 1; k++) {
      const p = G2.lerp(s.a, s.b, cuts[k]), q = G2.lerp(s.a, s.b, cuts[k + 1]);
      if (G2.dist(p, q) < 1) continue;
      const u = nodeAt(p), v = nodeAt(q); if (u === v) continue;
      const key = u < v ? u + '-' + v : v + '-' + u;
      if (!edgeSet.has(key)) edgeSet.set(key, { u, v, w: s.w });
    }
  }
  // 3. remove arestas pendentes (grau 1) iterativamente
  let edges = [...edgeSet.values()];
  let pruned = true;
  while (pruned) {
    pruned = false; const deg = new Array(nodes.length).fill(0);
    for (const e of edges) { deg[e.u]++; deg[e.v]++; }
    const ne = edges.filter(e => deg[e.u] > 1 && deg[e.v] > 1);
    if (ne.length !== edges.length) { edges = ne; pruned = true; }
  }
  // 4. semi-arestas ordenadas por ângulo
  const half = [];
  for (const n of nodes) n.out = [];
  edges.forEach((e) => {
    const h1 = { from: e.u, to: e.v, w: e.w, used: false }, h2 = { from: e.v, to: e.u, w: e.w, used: false };
    h1.twin = h2; h2.twin = h1; half.push(h1, h2); nodes[e.u].out.push(h1); nodes[e.v].out.push(h2);
  });
  for (const n of nodes) {
    for (const h of n.out) h.ang = Math.atan2(nodes[h.to].y - n.y, nodes[h.to].x - n.x);
    n.out.sort((a, b) => a.ang - b.ang);
  }
  // 5. percorre faces: em cada nó, sai pela próxima aresta no sentido horário a partir da gêmea
  const faces = [];
  for (const h0 of half) {
    if (h0.used) continue;
    const poly = [], ws = []; let h = h0, guard = 0;
    while (!h.used && guard++ < 2000) {
      h.used = true; poly.push({ x: nodes[h.from].x, y: nodes[h.from].y }); ws.push(h.w);
      const n = nodes[h.to], out = n.out, idx = out.indexOf(h.twin);
      h = out[(idx - 1 + out.length) % out.length];
    }
    if (h !== h0 || poly.length < 3) continue;
    const a = G2.areaSigned(poly);
    if (a > 1) faces.push({ poly, ws, a }); // faces internas (orientação positiva); a externa fica negativa
  }
  // 6. monta cômodos e associa metadados (âncora dentro do polígono)
  const rooms = [];
  const metaUsed = new Set();
  faces.sort((x, y) => x.a - y.a);
  for (const f of faces) {
    if (f.a < 5000) continue; // < 0,5 m² ignorado (ex.: shafts)
    const insetOffs = f.ws.map(w => w.thickness / 2);
    const inner = G2.insetPoly(f.poly, insetOffs);
    const room = {
      key: f.poly.map(p => Math.round(p.x / 5) + ',' + Math.round(p.y / 5)).sort().join(';'),
      poly: f.poly, inner, areaAxis: f.a, area: G2.area(inner), perimeter: G2.perimeter(inner), wallIds: [...new Set(f.ws.map(w => w.id))], meta: null,
    };
    const bb = G2.bbox(inner); room.width = bb.w; room.length = bb.h;
    for (const m of fl.roomMeta) if (!metaUsed.has(m.id) && G2.inPoly(m.anchor, f.poly)) { room.meta = m; metaUsed.add(m.id); break; }
    room.label = room.meta?.labelPos && G2.inPoly(room.meta.labelPos, f.poly) ? room.meta.labelPos : G2.labelPoint(inner);
    rooms.push(room);
  }
  return { rooms, orphanMeta: fl.roomMeta.filter(m => !metaUsed.has(m.id)) };
};

AS.roomsCache = null;
AS.rooms = (fl = AS.floor()) => {
  AS.roomsCache ||= {};
  const k = fl.id + ':' + S.version;
  if (!AS.roomsCache[k]) AS.roomsCache[k] = AS.detectRooms(fl);
  return AS.roomsCache[k];
};
AS.roomName = (r) => r.meta?.name || 'Cômodo sem nome';
AS.roomById = (metaId, fl = AS.floor()) => AS.rooms(fl).rooms.find(r => r.meta?.id === metaId);

/** Garante que o cômodo tenha metadados (para renomear, colorir etc.) */
AS.ensureRoomMeta = (room, fl = AS.floor()) => {
  if (room.meta) return room.meta;
  const m = { id: AS.uid('rm'), anchor: { ...room.label }, labelPos: null, name: 'Cômodo', type: 'outro', color: null, floorMaterial: null, ceiling: true };
  fl.roomMeta.push(m); room.meta = m; return m;
};

AS.addRoomMeta = (anchor, name, type, fl = AS.floor(), extra = {}) => {
  const t = AS.roomType(type);
  const m = { id: AS.uid('rm'), anchor: { ...anchor }, labelPos: null, name: name || t.name, type: t.id, color: null, floorMaterial: null, ceiling: true, ...extra };
  fl.roomMeta.push(m); return m;
};

/* ---------- Aberturas ---------- */
AS.addOpening = (kind, wall, t, opts = {}, fl = AS.floor()) => {
  const o = kind === 'door'
    ? { id: AS.uid('op'), kind, wallId: wall.id, t, width: 80, height: 210, sill: 0, type: 'giro', hinge: 'a', side: 1, material: 'mad_freijo', frame: 'mad_freijo', locked: false, hidden: false, ...opts }
    : { id: AS.uid('op'), kind, wallId: wall.id, t, width: 120, height: 110, sill: 100, type: 'correr', hinge: 'a', side: 1, material: 'vidro', frame: 'aluminio', locked: false, hidden: false, ...opts };
  const L = AS.wallLen(wall);
  o.width = Math.min(o.width, L - 2);
  o.t = AS.clamp(o.t, o.width / 2, L - o.width / 2);
  fl.openings.push(o); return o;
};

AS.addFurniture = (type, x, y, rot = 0, fl = AS.floor(), extra = {}) => {
  const d = AS.furnDef(type);
  const f = { id: AS.uid('fu'), type, name: d.name, x, y, w: d.w, d: d.d, h: d.h, rot, material: d.mat, elev: 0, locked: false, hidden: false, groupId: null, ...extra };
  fl.furniture.push(f); return f;
};

/* ---------- Métricas gerais ---------- */
AS.metrics = (fl = AS.floor()) => {
  const { rooms } = AS.rooms(fl);
  const walls = fl.walls;
  let built = 0;
  // área construída ≈ soma das áreas pelo eixo + meia espessura das paredes externas (aprox. pelo contorno)
  const util = rooms.reduce((s, r) => s + r.area, 0);
  const axis = rooms.reduce((s, r) => s + r.areaAxis, 0);
  const ext = walls.filter(w => w.type === 'exterior').reduce((s, w) => s + AS.wallLen(w) * w.thickness / 2, 0);
  built = axis + ext;
  return { rooms: rooms.length, util, axis, built, walls: walls.length, wallLen: walls.reduce((s, w) => s + AS.wallLen(w), 0), doors: fl.openings.filter(o => o.kind === 'door').length, windows: fl.openings.filter(o => o.kind === 'window').length, furniture: fl.furniture.length };
};

/* ---------- Serialização ---------- */
AS.serialize = (includeAssets = true) => {
  const p = AS.clone(S.project);
  if (!includeAssets) p.assets = {};
  // anexa cômodos calculados (somente leitura) para consumo externo
  p.computed = { generatedAt: new Date().toISOString(), floors: S.project.floors.map(fl => ({ floorId: fl.id, name: fl.name, rooms: AS.rooms(fl).rooms.map(r => ({ id: r.meta?.id || null, name: AS.roomName(r), type: r.meta?.type || null, boundary: r.inner.map(p => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1) })), area_m2: +(r.area / 1e4).toFixed(3), perimeter_m: +(r.perimeter / 100).toFixed(3), floor: fl.id })) })) };
  return p;
};

AS.validateProjectData = (p) => {
  const errs = [];
  if (!p || typeof p !== 'object') return ['Arquivo não é um objeto JSON'];
  if (!Array.isArray(p.floors) || !p.floors.length) errs.push('Campo "floors" ausente ou vazio');
  for (const f of p.floors || []) {
    if (!Array.isArray(f.walls)) errs.push(`Pavimento ${f.name || '?'}: "walls" inválido`);
    for (const w of f.walls || []) if (!w.a || !w.b || !isFinite(w.a.x) || !isFinite(w.b.y)) { errs.push(`Parede ${w.id} com coordenadas inválidas`); break; }
  }
  return errs;
};

AS.normalizeProject = (p) => {
  const base = AS.newProject(p.name || 'Projeto importado');
  const out = Object.assign(base, p);
  out.settings = Object.assign(AS.newProject().settings, p.settings || {});
  out.view3d = Object.assign(AS.newProject().view3d, p.view3d || {});
  out.materials = p.materials?.length ? p.materials : AS.clone(AS.DEFAULT_MATERIALS);
  for (const m of AS.DEFAULT_MATERIALS) if (!out.materials.some(x => x.id === m.id)) out.materials.push(AS.clone(m));
  out.assets = p.assets || {};
  for (const f of out.floors) {
    f.walls ||= []; f.openings ||= []; f.furniture ||= []; f.roomMeta ||= []; f.dims ||= [];
    f.height ||= 280; f.elevation ||= 0; if (f.visible === undefined) f.visible = true;
    for (const w of f.walls) { w.id ||= AS.uid('w'); w.thickness ||= 15; w.height ||= f.height; w.material ||= 'pint_branca'; w.type ||= 'interior'; }
  }
  if (!out.floors.some(f => f.id === out.activeFloor)) out.activeFloor = out.floors[0].id;
  delete out.computed;
  return out;
};

/* ---- 03-render2d.js ---- */
/* ==========================================================================
   03 — Renderização 2D da planta (Canvas). Também usada para exportar PNG/PDF.
   ========================================================================== */
const R2 = AS.r2d = {
  canvas: null, ctx: null, dpr: 1,
  view: { s: 0.6, ox: 0, oy: 0 }, // px por cm, deslocamento em px
  w: 0, h: 0,
  overlay: null, // desenhado pelo editor (preview, guias, marquee)
  imgs: {},      // cache de imagens de fundo
  dirty: true,
};

R2.colors = () => {
  const cs = getComputedStyle(document.documentElement);
  const g = (n) => cs.getPropertyValue(n).trim();
  return { paper: g('--canvas'), grid: g('--grid'), gridMajor: g('--grid-major'), wall: g('--wall'), wallFill: g('--wall-fill'), ink: g('--ink'), muted: g('--muted'), accent: g('--accent'), sel: g('--sel'), dim: g('--dim'), room: g('--room-label'), warn: g('--warn'), ok: g('--ok') };
};

R2.init = (canvas) => {
  R2.canvas = canvas; R2.ctx = canvas.getContext('2d');
  const ro = new ResizeObserver(() => R2.resize()); ro.observe(canvas.parentElement);
  R2.resize();
  const loop = () => { if (R2.dirty) { R2.dirty = false; R2.draw(); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
};
R2.req = () => { R2.dirty = true; };
R2.resize = () => {
  const el = R2.canvas.parentElement, r = el.getBoundingClientRect();
  R2.dpr = Math.min(2, window.devicePixelRatio || 1);
  const nw = Math.max(10, r.width), nh = Math.max(10, r.height);
  // mantém o centro da vista ao redimensionar (abrir/fechar painéis)
  if (R2.w > 50 && R2.h > 50 && !R2.needFit) { R2.view.ox += (nw - R2.w) / 2; R2.view.oy += (nh - R2.h) / 2; }
  R2.w = nw; R2.h = nh;
  R2.canvas.width = R2.w * R2.dpr; R2.canvas.height = R2.h * R2.dpr;
  R2.canvas.style.width = R2.w + 'px'; R2.canvas.style.height = R2.h + 'px';
  if (R2.needFit && R2.w >= 120 && R2.h >= 120 && S.project) R2.fit();
  R2.req();
};
R2.toWorld = (sx, sy, v = R2.view) => ({ x: (sx - v.ox) / v.s, y: (sy - v.oy) / v.s });
R2.toScreen = (p, v = R2.view) => ({ x: p.x * v.s + v.ox, y: p.y * v.s + v.oy });

R2.fit = (fl = AS.floor(), pad = 60) => {
  R2.needFit = R2.w < 120 || R2.h < 120; // ainda sem layout: refaz ao redimensionar
  const pts = [];
  for (const w of fl.walls) pts.push(w.a, w.b);
  for (const f of fl.furniture) pts.push({ x: f.x, y: f.y });
  if (fl.bg && fl.bg.w) pts.push({ x: fl.bg.x, y: fl.bg.y }, { x: fl.bg.x + fl.bg.w * fl.bg.scale, y: fl.bg.y + fl.bg.h * fl.bg.scale });
  if (!pts.length) { R2.view.s = 0.5; R2.view.ox = R2.w / 2; R2.view.oy = R2.h / 2; R2.req(); return; }
  const b = AS.geo.bbox(pts);
  const s = Math.min((R2.w - pad * 2) / Math.max(100, b.w), (R2.h - pad * 2) / Math.max(100, b.h));
  R2.view.s = AS.clamp(s, 0.02, 8);
  R2.view.ox = R2.w / 2 - (b.x0 + b.w / 2) * R2.view.s;
  R2.view.oy = R2.h / 2 - (b.y0 + b.h / 2) * R2.view.s;
  R2.req(); AS.bus.emit('view');
};
R2.zoomAt = (factor, sx, sy) => {
  const v = R2.view, p = R2.toWorld(sx, sy);
  v.s = AS.clamp(v.s * factor, 0.02, 10);
  v.ox = sx - p.x * v.s; v.oy = sy - p.y * v.s; R2.req(); AS.bus.emit('view');
};

/* ---------- desenho de padrões de materiais (hachura simples para piso no 2D) ---------- */
R2.matColor = (id) => AS.mat(id)?.color || '#ccc';

/** Polígono do corpo da parede (retângulo) */
R2.wallPoly = (w, extendA = 0, extendB = 0) => {
  const d = AS.wallDir(w), n = AS.geo.perp(d), h = w.thickness / 2;
  const a = AS.geo.sub(w.a, AS.geo.mul(d, extendA)), b = AS.geo.add(w.b, AS.geo.mul(d, extendB));
  return [AS.geo.add(a, AS.geo.mul(n, h)), AS.geo.add(b, AS.geo.mul(n, h)), AS.geo.sub(b, AS.geo.mul(n, h)), AS.geo.sub(a, AS.geo.mul(n, h))];
};
/** extensão de junção: quando a extremidade encontra outra parede, estende metade da espessura máxima */
R2.wallExt = (w, fl) => {
  const ext = { a: 0, b: 0 };
  for (const e of ['a', 'b']) {
    const others = AS.wallsAt(w[e], fl, 1, w.id).filter(o => Math.abs(AS.geo.cross(AS.wallDir(o.w), AS.wallDir(w))) > 0.2);
    if (others.length) ext[e] = Math.max(...others.map(o => o.w.thickness)) / 2;
    else { // termina sobre o meio de outra parede (T)
      const host = fl.walls.find(v => v.id !== w.id && !v.hidden && AS.geo.projSeg(w[e], v.a, v.b).d < 1.5);
      if (host) ext[e] = host.thickness / 2;
    }
  }
  return ext;
};

R2.path = (ctx, pts, v) => {
  ctx.beginPath();
  pts.forEach((p, i) => { const q = R2.toScreen(p, v); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); });
  ctx.closePath();
};

/**
 * Desenha a planta em ctx. opts: {view, w, h, export:true, floor, selection, colors}
 */
R2.drawPlan = (ctx, opts = {}) => {
  const v = opts.view || R2.view, fl = opts.floor || AS.floor(), C = opts.colors || R2.colors();
  const st = S.project.settings, W = opts.w ?? R2.w, H = opts.h ?? R2.h;
  const sel = opts.export ? new Set() : new Set(S.sel.map(s => s.kind + ':' + s.id));
  const isSel = (k, id) => sel.has(k + ':' + id);
  ctx.fillStyle = opts.export ? '#ffffff' : C.paper; ctx.fillRect(0, 0, W, H);

  // imagem de referência (PDF/PNG importado)
  if (fl.bg && fl.bg.visible !== false && !opts.export) {
    const asset = S.project.assets[fl.bg.asset];
    if (asset) {
      let img = R2.imgs[fl.bg.asset];
      if (!img) { img = new Image(); img.onload = () => R2.req(); img.src = asset; R2.imgs[fl.bg.asset] = img; }
      if (img.complete && img.naturalWidth) {
        const p = R2.toScreen({ x: fl.bg.x, y: fl.bg.y }, v);
        ctx.save(); ctx.globalAlpha = fl.bg.opacity ?? 0.5;
        ctx.translate(p.x, p.y); if (fl.bg.rot) ctx.rotate(AS.rad(fl.bg.rot));
        ctx.drawImage(img, 0, 0, fl.bg.w * fl.bg.scale * v.s, fl.bg.h * fl.bg.scale * v.s);
        ctx.restore();
      }
    }
  }

  // grade
  if (st.showGrid && !opts.export) {
    const steps = [5, 10, 25, 50, 100, 250, 500, 1000];
    let minor = steps.find(s => s * v.s >= 9) || 1000;
    const major = minor * (minor === 25 || minor === 250 ? 4 : 5) * (minor === 5 ? 2 : 1);
    const p0 = R2.toWorld(0, 0, v), p1 = R2.toWorld(W, H, v);
    ctx.lineWidth = 1;
    for (const [step, col] of [[minor, C.grid], [major, C.gridMajor]]) {
      ctx.strokeStyle = col; ctx.beginPath();
      for (let x = Math.floor(p0.x / step) * step; x <= p1.x; x += step) { const sx = Math.round(x * v.s + v.ox) + 0.5; ctx.moveTo(sx, 0); ctx.lineTo(sx, H); }
      for (let y = Math.floor(p0.y / step) * step; y <= p1.y; y += step) { const sy = Math.round(y * v.s + v.oy) + 0.5; ctx.moveTo(0, sy); ctx.lineTo(W, sy); }
      ctx.stroke();
    }
  }

  // pavimento inferior (fantasma) para alinhamento
  if (st.showLower && !opts.export) {
    const idx = S.project.floors.indexOf(fl);
    const lower = S.project.floors[idx - 1];
    if (lower) {
      ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = C.muted;
      for (const w of lower.walls) { R2.path(ctx, R2.wallPoly(w), v); ctx.fill(); }
      ctx.restore();
    }
  }

  // cômodos
  const { rooms } = AS.rooms(fl);
  for (const r of rooms) {
    const m = r.meta, t = AS.roomType(m?.type);
    const col = m?.color || (m ? t.color : null);
    R2.path(ctx, r.inner, v);
    ctx.fillStyle = col ? col : (opts.export ? '#f4f2ee' : C.grid);
    ctx.globalAlpha = opts.export ? 1 : 0.75; ctx.fill(); ctx.globalAlpha = 1;
    if (m && isSel('room', m.id)) { ctx.fillStyle = C.sel; ctx.globalAlpha = 0.12; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = C.sel; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]); }
  }

  // mobiliário (abaixo das paredes)
  if (st.showFurniture) for (const f of fl.furniture) { if (f.hidden) continue; R2.drawFurniture(ctx, f, v, C, isSel('furniture', f.id), opts.export); }

  // paredes: contorno (traço grosso) e preenchimento por cima => união limpa
  const walls = fl.walls.filter(w => !w.hidden);
  const polys = walls.map(w => { const e = R2.wallExt(w, fl); return { w, poly: R2.wallPoly(w, e.a, e.b) }; });
  ctx.lineJoin = 'miter';
  ctx.strokeStyle = opts.export ? '#1b1d22' : C.wall; ctx.lineWidth = Math.max(1.2, Math.min(2.2, v.s * 2));
  for (const { poly } of polys) { R2.path(ctx, poly, v); ctx.stroke(); }
  for (const { w, poly } of polys) {
    R2.path(ctx, poly, v);
    ctx.fillStyle = opts.export ? (w.type === 'exterior' ? '#3a3d44' : '#6b6f78') : (w.type === 'exterior' ? C.wall : C.wallFill);
    if (w.note === 'Guarda-corpo') ctx.fillStyle = opts.export ? '#b9bcc2' : C.muted;
    ctx.fill();
  }
  // aberturas: recorte + símbolo
  for (const o of fl.openings) { if (o.hidden) continue; const w = fl.walls.find(x => x.id === o.wallId); if (!w || w.hidden) continue; R2.drawOpening(ctx, o, w, v, C, isSel('opening', o.id), opts.export, fl); }
  // seleção de paredes
  for (const { w, poly } of polys) {
    if (!isSel('wall', w.id)) continue;
    R2.path(ctx, poly, v); ctx.strokeStyle = C.sel; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = C.sel; ctx.globalAlpha = 0.25; ctx.fill(); ctx.globalAlpha = 1;
    for (const p of [w.a, w.b]) { const q = R2.toScreen(p, v); ctx.fillStyle = '#fff'; ctx.strokeStyle = C.sel; ctx.lineWidth = 2; ctx.beginPath(); ctx.rect(q.x - 5, q.y - 5, 10, 10); ctx.fill(); ctx.stroke(); }
    if (w.locked) { const m = R2.toScreen(AS.geo.lerp(w.a, w.b, 0.5), v); ctx.fillStyle = C.sel; ctx.font = '600 11px var(--f-ui), sans-serif'; ctx.fillText('🔒', m.x - 6, m.y - 8); }
  }

  // cotas das paredes
  if (st.showDims || opts.export) {
    ctx.font = `500 ${opts.export ? 12 : 11}px "IBM Plex Mono", ui-monospace, monospace`;
    for (const w of walls) {
      const L = AS.wallLen(w); if (L * v.s < 38) continue;
      if (!opts.export && !st.showDims && !isSel('wall', w.id)) continue;
      R2.drawDim(ctx, w.a, w.b, (w.type === 'exterior' ? 1 : 0.6) * (w.thickness / 2 + 26 / v.s), v, opts.export ? '#5a5f6a' : C.dim, AS.units.fmt(L), w, fl);
    }
  } else {
    for (const s of S.sel) if (s.kind === 'wall') { const w = AS.find('wall', s.id, fl); if (w) R2.drawDim(ctx, w.a, w.b, w.thickness / 2 + 26 / v.s, v, C.sel, AS.units.fmt(AS.wallLen(w)), w, fl); }
  }
  // cotas manuais (ferramenta medir)
  for (const d of fl.dims) {
    R2.drawDim(ctx, d.a, d.b, d.off || 0, v, isSel('dim', d.id) ? C.sel : (opts.export ? '#1f5fbf' : C.accent), AS.units.fmt(AS.geo.dist(d.a, d.b)), null, fl, true);
  }

  // rótulos de cômodos
  for (const r of rooms) {
    const q = R2.toScreen(r.label, v), m = r.meta;
    const area = st.roomAreaMode === 'eixo' ? r.areaAxis : r.area;
    const bb = AS.geo.bbox(r.inner), maxW = bb.w * v.s;
    if (maxW < 40) continue;
    const fs = AS.clamp(v.s * 28, 10, 16);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = opts.export ? '#14161a' : C.room;
    let name = (m ? m.name : 'Cômodo').toUpperCase(), nfs = fs;
    ctx.font = `600 ${nfs}px "Archivo", "IBM Plex Sans", sans-serif`;
    const avail = maxW - 10;
    while (ctx.measureText(name).width > avail && nfs > 8) { nfs -= 0.5; ctx.font = `600 ${nfs}px "Archivo", "IBM Plex Sans", sans-serif`; }
    while (ctx.measureText(name).width > avail && name.length > 4) name = name.slice(0, -2) + '…';
    ctx.fillText(name, q.x, q.y - fs * 0.55);
    ctx.font = `500 ${fs * 0.82}px "IBM Plex Mono", monospace`;
    ctx.fillStyle = opts.export ? '#4a4f59' : C.muted;
    ctx.fillText(AS.units.fmtArea(area), q.x, q.y + fs * 0.6);
    if (m?.uncertain) { ctx.fillStyle = C.warn; ctx.fillText('medidas estimadas', q.x, q.y + fs * 1.7); }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  if (!opts.export && R2.overlay) R2.overlay(ctx, v, C);
};

R2.drawDim = (ctx, a, b, off, v, color, text, wall, fl, manual = false) => {
  const d = AS.geo.norm(AS.geo.sub(b, a)); let n = AS.geo.perp(d);
  // posiciona a cota para fora do cômodo (lado oposto ao centro do desenho) para paredes externas
  if (wall && wall.type === 'exterior') {
    const c = R2._center || { x: 0, y: 0 };
    const mid = AS.geo.lerp(a, b, 0.5);
    if (AS.geo.dot(AS.geo.sub(mid, c), n) < 0) n = AS.geo.mul(n, -1);
  }
  const A = R2.toScreen(AS.geo.add(a, AS.geo.mul(n, off)), v), B = R2.toScreen(AS.geo.add(b, AS.geo.mul(n, off)), v);
  const a0 = R2.toScreen(a, v), b0 = R2.toScreen(b, v);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1;
  ctx.globalAlpha = manual ? 1 : 0.9;
  if (off) { ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(A.x, A.y); ctx.moveTo(b0.x, b0.y); ctx.lineTo(B.x, B.y); ctx.stroke(); ctx.setLineDash([]); }
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  // marcas oblíquas (padrão arquitetônico)
  for (const P of [A, B]) { ctx.beginPath(); ctx.moveTo(P.x - 4, P.y + 4); ctx.lineTo(P.x + 4, P.y - 4); ctx.stroke(); }
  const ang = Math.atan2(B.y - A.y, B.x - A.x);
  const m = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
  ctx.translate(m.x, m.y); let r = ang; if (r > Math.PI / 2 || r < -Math.PI / 2) r += Math.PI; ctx.rotate(r);
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim() || '#fff';
  if (ctx.canvas.dataset.export) ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.85; ctx.fillRect(-tw / 2 - 3, -14, tw + 6, 13); ctx.globalAlpha = 1;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(text, 0, -4);
  ctx.restore();
};

R2.openingGeom = (o, w) => {
  const d = AS.wallDir(w), n = AS.geo.perp(d), L = AS.wallLen(w);
  const c = AS.geo.lerp(w.a, w.b, o.t / L);
  const p0 = AS.geo.sub(c, AS.geo.mul(d, o.width / 2)), p1 = AS.geo.add(c, AS.geo.mul(d, o.width / 2));
  return { d, n, c, p0, p1, L };
};

R2.drawOpening = (ctx, o, w, v, C, selected, exp, fl) => {
  const { d, n, c, p0, p1 } = R2.openingGeom(o, w);
  const h = w.thickness / 2 + 0.6;
  const cut = [AS.geo.add(p0, AS.geo.mul(n, h)), AS.geo.add(p1, AS.geo.mul(n, h)), AS.geo.sub(p1, AS.geo.mul(n, h)), AS.geo.sub(p0, AS.geo.mul(n, h))];
  R2.path(ctx, cut, v); ctx.fillStyle = exp ? '#ffffff' : C.paper; ctx.fill();
  const ink = selected ? C.sel : (exp ? '#1b1d22' : C.ink);
  ctx.strokeStyle = ink; ctx.lineWidth = selected ? 2 : 1.2;
  // batentes
  ctx.beginPath();
  for (const p of [p0, p1]) { const A = R2.toScreen(AS.geo.add(p, AS.geo.mul(n, h)), v), B = R2.toScreen(AS.geo.sub(p, AS.geo.mul(n, h)), v); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); }
  ctx.stroke();
  const S2 = (p) => R2.toScreen(p, v);
  if (o.kind === 'window') {
    ctx.beginPath();
    for (const k of [-0.25, 0.25]) { const A = S2(AS.geo.add(p0, AS.geo.mul(n, h * k * 2))), B = S2(AS.geo.add(p1, AS.geo.mul(n, h * k * 2))); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); }
    ctx.stroke();
    if (o.type === 'correr') { ctx.beginPath(); const A = S2(AS.geo.add(c, AS.geo.mul(n, h * 0.5))), B = S2(AS.geo.sub(c, AS.geo.mul(n, h * 0.5))); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); }
  } else {
    const side = o.side || 1, nn = AS.geo.mul(n, side);
    const hingeP = o.hinge === 'b' ? p1 : p0, otherP = o.hinge === 'b' ? p0 : p1;
    const face = AS.geo.add(hingeP, AS.geo.mul(nn, h)), faceO = AS.geo.add(otherP, AS.geo.mul(nn, h));
    if (o.type === 'giro' || o.type === 'dupla') {
      const leaves = o.type === 'dupla' ? [[p0, p1, o.width / 2], [p1, p0, o.width / 2]] : [[hingeP, otherP, o.width]];
      for (const [hp, op, lw] of leaves) {
        const f = AS.geo.add(hp, AS.geo.mul(nn, h)), fo = AS.geo.add(op, AS.geo.mul(nn, h));
        const along = AS.geo.norm(AS.geo.sub(fo, f));
        const tip = AS.geo.add(f, AS.geo.mul(nn, lw));
        const F = S2(f), T = S2(tip);
        ctx.beginPath(); ctx.moveTo(F.x, F.y); ctx.lineTo(T.x, T.y); ctx.lineWidth = selected ? 2.5 : 2; ctx.stroke();
        // arco
        const a1 = Math.atan2(T.y - F.y, T.x - F.x), endP = S2(AS.geo.add(f, AS.geo.mul(along, lw))), a2 = Math.atan2(endP.y - F.y, endP.x - F.x);
        let diff = a2 - a1; while (diff > Math.PI) diff -= 2 * Math.PI; while (diff < -Math.PI) diff += 2 * Math.PI;
        ctx.beginPath(); ctx.lineWidth = 0.9; ctx.setLineDash([3, 3]); ctx.arc(F.x, F.y, lw * v.s, a1, a1 + diff, diff < 0); ctx.stroke(); ctx.setLineDash([]);
      }
    } else if (o.type === 'correr') {
      ctx.lineWidth = selected ? 2.5 : 2;
      const half = o.width / 2;
      const l1a = AS.geo.add(p0, AS.geo.mul(n, h * 0.35)), l1b = AS.geo.add(l1a, AS.geo.mul(d, half + 5));
      const l2b = AS.geo.sub(p1, AS.geo.mul(n, h * 0.35)), l2a = AS.geo.sub(l2b, AS.geo.mul(d, half + 5));
      ctx.beginPath(); let A = S2(l1a), B = S2(l1b); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); A = S2(l2a); B = S2(l2b); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    } else { // passagem
      ctx.setLineDash([4, 3]); ctx.lineWidth = 1; ctx.beginPath(); const A = S2(p0), B = S2(p1); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  if (selected) {
    for (const p of [p0, p1]) { const q = S2(p); ctx.fillStyle = '#fff'; ctx.strokeStyle = C.sel; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    R2.drawDim(ctx, p0, p1, -(w.thickness / 2 + 18 / v.s), v, C.sel, AS.units.fmt(o.width), null, fl, true);
  }
};

/* ---------- símbolos de mobiliário (vista superior) ---------- */
R2.drawFurniture = (ctx, f, v, C, selected, exp) => {
  const c = R2.toScreen(f, v), s = v.s;
  const w = f.w * s, d = f.d * s;
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(AS.rad(f.rot || 0));
  const ink = selected ? C.sel : (exp ? '#30333a' : C.muted);
  const fill = exp ? '#ffffff' : (R2._furnFill ||= getComputedStyle(document.documentElement).getPropertyValue('--furn').trim());
  ctx.lineWidth = selected ? 1.8 : 1; ctx.strokeStyle = ink; ctx.fillStyle = fill;
  const rr = (x, y, ww, hh, r = 3) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, ww, hh, Math.min(r, ww / 2, hh / 2)); else ctx.rect(x, y, ww, hh); };
  const box = () => { rr(-w / 2, -d / 2, w, d, 2 * s); ctx.fill(); ctx.stroke(); };
  const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); ctx.fill(); ctx.stroke(); };
  switch (f.type) {
    case 'cama_casal': case 'cama_queen': case 'cama_solteiro': {
      box(); const pw = f.type === 'cama_solteiro' ? w * 0.7 : w * 0.4, ph = 28 * s;
      if (f.type === 'cama_solteiro') { rr(-pw / 2, -d / 2 + 8 * s, pw, ph, 6 * s); ctx.fill(); ctx.stroke(); }
      else { rr(-w / 2 + 8 * s, -d / 2 + 8 * s, pw, ph, 6 * s); ctx.fill(); ctx.stroke(); rr(w / 2 - 8 * s - pw, -d / 2 + 8 * s, pw, ph, 6 * s); ctx.fill(); ctx.stroke(); }
      line(-w / 2, -d / 2 + 50 * s, w / 2, -d / 2 + 50 * s); line(-w / 2, -d / 2 + 50 * s, w / 2 - 20 * s, d / 2); break;
    }
    case 'sofa3': case 'sofa2': case 'poltrona': {
      box(); rr(-w / 2, -d / 2, w, 22 * s, 3 * s); ctx.stroke(); rr(-w / 2, -d / 2, 18 * s, d, 3 * s); ctx.stroke(); rr(w / 2 - 18 * s, -d / 2, 18 * s, d, 3 * s); ctx.stroke();
      const n = f.type === 'sofa3' ? 3 : f.type === 'sofa2' ? 2 : 1, cw = (w - 36 * s) / n; for (let i = 1; i < n; i++) line(-w / 2 + 18 * s + cw * i, -d / 2 + 22 * s, -w / 2 + 18 * s + cw * i, d / 2); break;
    }
    case 'mesa_jantar4': case 'mesa_jantar6': {
      const n = f.type === 'mesa_jantar6' ? 3 : 2, chW = 42 * s, chD = 40 * s;
      for (let i = 0; i < n; i++) { const x = -w / 2 + w * (i + 0.5) / n - chW / 2; rr(x, -d / 2 - chD * 0.6, chW, chD, 4 * s); ctx.fill(); ctx.stroke(); rr(x, d / 2 - chD * 0.4, chW, chD, 4 * s); ctx.fill(); ctx.stroke(); }
      box(); break;
    }
    case 'mesa_redonda': { for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; circ(Math.cos(a) * w * 0.55, Math.sin(a) * w * 0.55, 18 * s); } circ(0, 0, w / 2); break; }
    case 'vaso': { rr(-w / 2, -d / 2, w, 18 * s, 3 * s); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(0, 6 * s, w / 2 - 1, (d - 18 * s) / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); break; }
    case 'lavatorio': case 'pia_coz': case 'tanque': { box(); const bw = Math.min(w * 0.55, 60 * s); ctx.beginPath(); ctx.ellipse(0, 3 * s, bw / 2, d * 0.3, 0, 0, Math.PI * 2); ctx.stroke(); circ(0, -d / 2 + 7 * s, 2 * s); break; }
    case 'fogao': case 'cooktop': { box(); for (const [x, y] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) circ(x * w * 0.23, y * d * 0.22, Math.min(w, d) * 0.14); break; }
    case 'geladeira': { box(); line(-w / 2, d / 2 - 6 * s, w / 2, d / 2 - 6 * s); ctx.font = `${Math.max(7, 11 * s * 2.2)}px sans-serif`; break; }
    case 'box': { box(); line(-w / 2, -d / 2, w / 2, d / 2); line(w / 2, -d / 2, -w / 2, d / 2); circ(0, 0, 4 * s); break; }
    case 'banheira': { box(); rr(-w / 2 + 8 * s, -d / 2 + 8 * s, w - 16 * s, d - 16 * s, 25 * s); ctx.stroke(); break; }
    case 'guarda_roupa': case 'armario_coz': case 'armario_alto': case 'estante': case 'rack': {
      box(); const n = Math.max(1, Math.round(f.w / 50)); for (let i = 1; i < n; i++) line(-w / 2 + w * i / n, -d / 2, -w / 2 + w * i / n, d / 2);
      if (f.type === 'guarda_roupa') line(-w / 2, -d / 2 + 4 * s, w / 2, -d / 2 + 4 * s); break;
    }
    case 'planta': { ctx.fillStyle = exp ? '#e6efe2' : '#a9c49a55'; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; circ(Math.cos(a) * w * 0.22, Math.sin(a) * w * 0.22, w * 0.22); } ctx.fillStyle = fill; circ(0, 0, w * 0.18); break; }
    case 'tapete': { ctx.setLineDash([2, 3]); box(); ctx.setLineDash([]); break; }
    case 'carro': { rr(-w / 2, -d / 2, w, d, 30 * s); ctx.fill(); ctx.stroke(); rr(-w / 2 + 15 * s, -d / 2 + 110 * s, w - 30 * s, 100 * s, 15 * s); ctx.stroke(); rr(-w / 2 + 15 * s, d / 2 - 140 * s, w - 30 * s, 70 * s, 15 * s); ctx.stroke(); break; }
    case 'escada_reta': {
      box(); const steps = Math.max(2, Math.round(f.d / 28));
      for (let i = 1; i < steps; i++) line(-w / 2, -d / 2 + d * i / steps, w / 2, -d / 2 + d * i / steps);
      line(0, d / 2 - 10 * s, 0, -d / 2 + 15 * s); line(0, -d / 2 + 15 * s, -6 * s, -d / 2 + 27 * s); line(0, -d / 2 + 15 * s, 6 * s, -d / 2 + 27 * s); break;
    }
    case 'cadeira': case 'banqueta': { box(); if (f.type === 'cadeira') line(-w / 2, -d / 2 + 6 * s, w / 2, -d / 2 + 6 * s); break; }
    default: box(); line(-w / 2, -d / 2, w / 2, d / 2);
  }
  if (selected) {
    ctx.strokeStyle = C.sel; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.2; ctx.strokeRect(-w / 2 - 3, -d / 2 - 3, w + 6, d + 6); ctx.setLineDash([]);
    // alça de rotação e de redimensionamento
    ctx.beginPath(); ctx.moveTo(0, -d / 2 - 3); ctx.lineTo(0, -d / 2 - 22); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -d / 2 - 26, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(w / 2 - 2, d / 2 - 2, 9, 9); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
};

R2.draw = () => {
  if (!S.project || !R2.ctx) return;
  const ctx = R2.ctx;
  ctx.setTransform(R2.dpr, 0, 0, R2.dpr, 0, 0);
  const fl = AS.floor();
  const pts = fl.walls.flatMap(w => [w.a, w.b]);
  R2._center = pts.length ? (() => { const b = AS.geo.bbox(pts); return { x: b.x0 + b.w / 2, y: b.y0 + b.h / 2 }; })() : { x: 0, y: 0 };
  R2._furnFill = null;
  R2.drawPlan(ctx, {});
};

/** Renderiza a planta para um canvas fora da tela (exportação) */
R2.renderExport = (scalePxPerCm = 1.2, fl = AS.floor(), margin = 80) => {
  const pts = fl.walls.flatMap(w => [w.a, w.b]).concat(fl.furniture.map(f => ({ x: f.x, y: f.y })));
  if (!pts.length) throw new Error('A planta está vazia');
  const b = AS.geo.bbox(pts);
  const W = Math.ceil(b.w * scalePxPerCm + margin * 2), H = Math.ceil(b.h * scalePxPerCm + margin * 2 + 50);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.dataset.export = '1';
  const ctx = cv.getContext('2d');
  const view = { s: scalePxPerCm, ox: margin - b.x0 * scalePxPerCm, oy: margin + 40 - b.y0 * scalePxPerCm };
  R2._center = { x: b.x0 + b.w / 2, y: b.y0 + b.h / 2 };
  R2.drawPlan(ctx, { view, w: W, h: H, export: true, floor: fl });
  // carimbo
  ctx.fillStyle = '#14161a'; ctx.font = '600 20px "Archivo", sans-serif'; ctx.fillText(S.project.name + ' — ' + fl.name, margin, 36);
  const m = AS.metrics(fl);
  ctx.font = '13px "IBM Plex Mono", monospace'; ctx.fillStyle = '#4a4f59';
  ctx.fillText(`Área útil ${AS.units.fmtArea(m.util)} · ${m.rooms} cômodos · escala gráfica abaixo · Architect Studio Ultra`, margin, H - 18);
  // escala gráfica 1 m
  const sx = W - margin - 100 * scalePxPerCm, sy = H - 30;
  ctx.fillStyle = '#14161a'; ctx.fillRect(sx, sy, 100 * scalePxPerCm, 4); ctx.fillText('1 m', sx + 100 * scalePxPerCm + 6, sy + 6);
  return cv;
};

/* ---- 04-editor.js ---- */
/* ==========================================================================
   04 — Editor 2D: ferramentas, snaps, seleção, arrastes, atalhos, menu de contexto
   ========================================================================== */
const ED = AS.editor = {
  pointer: { x: 0, y: 0, w: { x: 0, y: 0 } },
  chain: null,          // desenho de parede em andamento {start, last}
  rectStart: null,      // ferramenta cômodo
  measureStart: null,
  drag: null,
  hover: null,
  snapInfo: null,
  guides: [],
  placing: null,        // {type} mobiliário
  calib: null,          // calibração de escala {p1, p2}
  spaceDown: false,
  pointers: new Map(),
};

ED.TOOLS = {
  select: { name: 'Selecionar / mover', key: 'V', cursor: 'default' },
  wall: { name: 'Desenhar parede', key: 'W', cursor: 'crosshair' },
  room: { name: 'Desenhar cômodo (retângulo)', key: 'R', cursor: 'crosshair' },
  door: { name: 'Adicionar porta', key: 'D', cursor: 'copy' },
  window: { name: 'Adicionar janela', key: 'J', cursor: 'copy' },
  furniture: { name: 'Adicionar móvel', key: 'M', cursor: 'copy' },
  measure: { name: 'Medir / cotar', key: 'T', cursor: 'crosshair' },
  split: { name: 'Dividir parede', key: 'X', cursor: 'crosshair' },
  pan: { name: 'Mover vista', key: 'H', cursor: 'grab' },
  calibrate: { name: 'Calibrar escala da referência', key: '', cursor: 'crosshair' },
  bgmove: { name: 'Posicionar referência', key: '', cursor: 'move' },
};

ED.setTool = (t, extra) => {
  ED.chain = null; ED.rectStart = null; ED.measureStart = null; ED.calib = t === 'calibrate' ? { pts: [] } : null;
  if (t !== 'furniture') ED.placing = null;
  if (t === 'furniture' && extra) ED.placing = { type: extra, rot: 0 };
  S.tool = t;
  ED.hideNumInput();
  if (R2.canvas) R2.canvas.style.cursor = ED.TOOLS[t]?.cursor || 'default';
  AS.bus.emit('tool', t);
  const hints = {
    select: 'Clique para selecionar · Shift+clique soma à seleção · arraste em área vazia para seleção em janela · botão direito: menu',
    wall: 'Clique para iniciar, clique para cada vértice · digite um número para comprimento exato · Esc/duplo clique encerra · Shift desliga snaps',
    room: 'Clique e arraste (ou clique em dois cantos) para criar um cômodo retangular com 4 paredes',
    door: 'Passe sobre uma parede e clique para inserir a porta', window: 'Passe sobre uma parede e clique para inserir a janela',
    furniture: 'Clique para posicionar · R gira 90° · Esc cancela', measure: 'Clique em dois pontos para criar uma cota',
    split: 'Clique sobre uma parede para dividi-la no ponto', pan: 'Arraste para mover a vista (também: botão do meio ou Espaço+arrastar)',
    calibrate: 'Clique em dois pontos da referência cuja distância real você conhece', bgmove: 'Arraste a imagem de referência para posicioná-la',
  };
  AS.hint(hints[t] || '');
  R2.req();
};

/* ---------- Snap ---------- */
ED.snap = (p, opts = {}) => {
  const fl = AS.floor(), st = S.project.settings, v = R2.view;
  const tolPx = 12, tol = tolPx / v.s;
  ED.guides = [];
  if (opts.free) return { p, kind: null };
  let best = null;
  // vértices
  if (st.snapCorner) for (const w of fl.walls) {
    if (opts.excludeWall && opts.excludeWall.has(w.id)) continue;
    for (const e of [w.a, w.b]) { const d = AS.geo.dist(e, p); if (d < tol && (!best || d < best.d)) best = { p: { ...e }, d, kind: 'vértice' }; }
  }
  if (best) return best;
  // meio / linha da parede
  if (st.snapWall) for (const w of fl.walls) {
    if (opts.excludeWall && opts.excludeWall.has(w.id)) continue;
    const mid = AS.geo.lerp(w.a, w.b, 0.5);
    if (AS.geo.dist(mid, p) < tol * 0.8) return { p: mid, d: 0, kind: 'meio da parede' };
    const pr = AS.geo.projSeg(p, w.a, w.b);
    if (pr.d < tol * 0.8 && (!best || pr.d < best.d)) best = { p: pr.p, d: pr.d, kind: 'parede', wall: w };
  }
  // ângulo a partir do ponto anterior
  let q = { ...p }, kind = null;
  if (opts.from && st.angleSnap) {
    const d = AS.geo.sub(p, opts.from), L = AS.geo.len(d);
    if (L > 0) {
      const ang = Math.atan2(d.y, d.x), stepA = Math.PI / 4, a2 = Math.round(ang / stepA) * stepA;
      if (Math.abs(ang - a2) < AS.rad(6)) {
        q = { x: opts.from.x + Math.cos(a2) * L, y: opts.from.y + Math.sin(a2) * L }; kind = 'ângulo ' + Math.round(((AS.deg(a2) % 360) + 360) % 360) + '°';
        if (best && best.wall) { const x = AS.geo.lineInter(opts.from, q, best.wall.a, best.wall.b); if (x && AS.geo.dist(x, q) < tol) return { p: x, kind: 'parede + ângulo' }; }
      }
    }
  }
  if (best) return best;
  // alinhamento com vértices existentes
  if (st.snapAlign) {
    let ax = null, ay = null;
    for (const w of fl.walls) for (const e of [w.a, w.b]) {
      if (opts.excludeWall && opts.excludeWall.has(w.id)) continue;
      if (Math.abs(e.x - q.x) < tol * 0.6 && (!ax || Math.abs(e.x - q.x) < Math.abs(ax.x - q.x))) ax = e;
      if (Math.abs(e.y - q.y) < tol * 0.6 && (!ay || Math.abs(e.y - q.y) < Math.abs(ay.y - q.y))) ay = e;
    }
    if (ax && (!kind || Math.abs(Math.cos(Math.atan2(q.y - (opts.from?.y || 0), q.x - (opts.from?.x || 0)))) < 0.99)) { q.x = ax.x; ED.guides.push({ a: ax, b: { ...q } }); kind = kind || 'alinhamento'; }

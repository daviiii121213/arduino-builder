    if (ay && (!kind || kind === 'alinhamento' || Math.abs(Math.sin(Math.atan2(q.y - (opts.from?.y || 0), q.x - (opts.from?.x || 0)))) < 0.99)) { q.y = ay.y; ED.guides.push({ a: ay, b: { ...q } }); kind = kind || 'alinhamento'; }
    if (ED.guides.length) return { p: q, kind };
  }
  if (kind) return { p: q, kind };
  if (st.snapGrid) { const g = st.grid || 10; return { p: { x: AS.round(q.x, g), y: AS.round(q.y, g) }, kind: 'grade' }; }
  return { p: q, kind: null };
};

/* ---------- Hit test ---------- */
ED.hit = (p, opts = {}) => {
  const fl = AS.floor(), v = R2.view, tol = 6 / v.s;
  // alças de seleção
  if (!opts.noHandles) for (const s of S.sel) {
    if (s.kind === 'wall') { const w = AS.find('wall', s.id); if (!w || w.locked) continue; for (const e of ['a', 'b']) if (AS.geo.dist(w[e], p) < 8 / v.s) return { kind: 'handle', wall: w, end: e }; }
    if (s.kind === 'furniture') {
      const f = AS.find('furniture', s.id); if (!f || f.locked) continue;
      const loc = AS.geo.rot({ x: p.x - f.x, y: p.y - f.y }, -AS.rad(f.rot || 0));
      if (Math.hypot(loc.x, loc.y + f.d / 2 + 26 / v.s) < 8 / v.s) return { kind: 'rotate', f };
      if (Math.abs(loc.x - (f.w / 2 + 2.5 / v.s)) < 8 / v.s && Math.abs(loc.y - (f.d / 2 + 2.5 / v.s)) < 8 / v.s) return { kind: 'resize', f };
    }
    if (s.kind === 'opening') {
      const o = AS.find('opening', s.id); if (!o || o.locked) continue; const w = fl.walls.find(x => x.id === o.wallId); if (!w) continue;
      const g = R2.openingGeom(o, w);
      if (AS.geo.dist(g.p0, p) < 8 / v.s) return { kind: 'ohandle', o, w, end: 0 };
      if (AS.geo.dist(g.p1, p) < 8 / v.s) return { kind: 'ohandle', o, w, end: 1 };
    }
  }
  for (const d of fl.dims) { if (AS.geo.projSeg(p, d.a, d.b).d < tol) return { kind: 'dim', id: d.id }; }
  for (const o of fl.openings) {
    if (o.hidden) continue; const w = fl.walls.find(x => x.id === o.wallId); if (!w || w.hidden) continue;
    const g = R2.openingGeom(o, w), pr = AS.geo.projSeg(p, g.p0, g.p1);
    if (pr.d < w.thickness / 2 + tol) return { kind: 'opening', id: o.id };
  }
  if (S.project.settings.showFurniture) for (let i = fl.furniture.length - 1; i >= 0; i--) {
    const f = fl.furniture[i]; if (f.hidden) continue;
    const loc = AS.geo.rot({ x: p.x - f.x, y: p.y - f.y }, -AS.rad(f.rot || 0));
    if (Math.abs(loc.x) <= f.w / 2 + tol && Math.abs(loc.y) <= f.d / 2 + tol) {
      // tapetes ficam por baixo: só se nada mais
      if (f.type === 'tapete' && !opts.allowRug) { opts.rug = f; continue; }
      return { kind: 'furniture', id: f.id };
    }
  }
  let bw = null, bd = Infinity;
  for (const w of fl.walls) { if (w.hidden) continue; const pr = AS.geo.projSeg(p, w.a, w.b); if (pr.d < w.thickness / 2 + tol && pr.d < bd) { bd = pr.d; bw = w; } }
  if (bw) return { kind: 'wall', id: bw.id };
  if (opts.rug) return { kind: 'furniture', id: opts.rug.id };
  const { rooms } = AS.rooms(fl);
  for (const r of rooms) if (AS.geo.inPoly(p, r.inner)) return { kind: 'room', room: r };
  return null;
};

/* ---------- Seleção ---------- */
ED.select = (items, add = false) => {
  const expand = (it) => { // grupos
    const o = AS.find(it.kind, it.id); if (!o?.groupId) return [it];
    const fl = AS.floor(), res = [];
    for (const w of fl.walls) if (w.groupId === o.groupId) res.push({ kind: 'wall', id: w.id });
    for (const f of fl.furniture) if (f.groupId === o.groupId) res.push({ kind: 'furniture', id: f.id });
    return res;
  };
  let list = items.flatMap(expand);
  if (add) {
    const cur = S.sel.slice();
    for (const it of list) { const i = cur.findIndex(s => s.kind === it.kind && s.id === it.id); if (i >= 0) cur.splice(i, 1); else cur.push(it); }
    list = cur;
  }
  S.sel = list.filter((it, i) => list.findIndex(x => x.kind === it.kind && x.id === it.id) === i);
  AS.bus.emit('selection'); R2.req();
};
ED.selected = (kind) => S.sel.filter(s => !kind || s.kind === kind).map(s => ({ ...s, o: AS.find(s.kind, s.id) })).filter(s => s.o);

/* ---------- Overlay (pré-visualizações) ---------- */
R2.overlay = (ctx, v, C) => {
  const P = ED.pointer.w, S2 = (p) => R2.toScreen(p, v);
  // guias
  ctx.save(); ctx.strokeStyle = C.accent; ctx.lineWidth = 1; ctx.setLineDash([5, 4]); ctx.globalAlpha = 0.8;
  for (const g of ED.guides) { const a = S2(g.a), b = S2(g.b); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.restore();
  // indicador de snap
  if (ED.snapInfo && ['wall', 'room', 'measure', 'split', 'calibrate', 'select'].includes(S.tool) && (S.tool !== 'select' || ED.drag)) {
    const q = S2(ED.snapInfo.p);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5;
    if (ED.snapInfo.kind === 'vértice') { ctx.strokeRect(q.x - 6, q.y - 6, 12, 12); }
    else if (ED.snapInfo.kind) { ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, Math.PI * 2); ctx.stroke(); }
    if (ED.snapInfo.kind && ED.snapInfo.kind !== 'grade') { ctx.font = '500 10px "IBM Plex Mono", monospace'; ctx.fillStyle = C.accent; ctx.fillText(ED.snapInfo.kind, q.x + 10, q.y - 8); }
  }
  // parede em desenho
  if (S.tool === 'wall' && ED.chain && ED.snapInfo) {
    const a = ED.chain.last, b = ED.snapInfo.p, th = S.project.settings.wallThickness;
    const tmp = { a, b, thickness: th };
    if (AS.geo.dist(a, b) > 0.5) {
      R2.path(ctx, R2.wallPoly(tmp), v); ctx.fillStyle = C.accent; ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = '600 12px "IBM Plex Mono", monospace';
      R2.drawDim(ctx, a, b, th / 2 + 24 / v.s, v, C.accent, AS.units.fmt(AS.geo.dist(a, b)) + ' · ' + Math.round(((AS.deg(Math.atan2(-(b.y - a.y), b.x - a.x)) % 360) + 360) % 360) + '°', null, AS.floor(), true);
    }
    const s0 = S2(ED.chain.start); ctx.strokeStyle = C.accent; ctx.beginPath(); ctx.arc(s0.x, s0.y, 6, 0, Math.PI * 2); ctx.stroke();
  }
  // cômodo retangular
  if (S.tool === 'room' && ED.rectStart && ED.snapInfo) {
    const a = ED.rectStart, b = ED.snapInfo.p;
    const pts = [a, { x: b.x, y: a.y }, b, { x: a.x, y: b.y }];
    R2.path(ctx, pts, v); ctx.fillStyle = C.accent; ctx.globalAlpha = 0.12; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = '600 12px "IBM Plex Mono", monospace';
    R2.drawDim(ctx, pts[0], pts[1], -20 / v.s, v, C.accent, AS.units.fmt(Math.abs(b.x - a.x)), null, AS.floor(), true);
    R2.drawDim(ctx, pts[1], pts[2], -20 / v.s, v, C.accent, AS.units.fmt(Math.abs(b.y - a.y)), null, AS.floor(), true);
    const c = S2({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }); ctx.fillStyle = C.accent; ctx.textAlign = 'center'; ctx.fillText(AS.units.fmtArea(Math.abs((b.x - a.x) * (b.y - a.y))), c.x, c.y); ctx.textAlign = 'left';
  }
  // medição
  if ((S.tool === 'measure' && ED.measureStart || S.tool === 'calibrate' && ED.calib?.pts.length === 1) && ED.snapInfo) {
    const a = S.tool === 'measure' ? ED.measureStart : ED.calib.pts[0];
    ctx.font = '600 12px "IBM Plex Mono", monospace';
    R2.drawDim(ctx, a, ED.snapInfo.p, 0, v, C.accent, AS.units.fmt(AS.geo.dist(a, ED.snapInfo.p)), null, AS.floor(), true);
  }
  if (S.tool === 'calibrate' && ED.calib) for (const p of ED.calib.pts) { const q = S2(p); ctx.strokeStyle = C.sel; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(q.x - 8, q.y); ctx.lineTo(q.x + 8, q.y); ctx.moveTo(q.x, q.y - 8); ctx.lineTo(q.x, q.y + 8); ctx.stroke(); }
  // porta/janela sob o cursor
  if ((S.tool === 'door' || S.tool === 'window') && ED.hover?.wall) {
    const w = ED.hover.wall, def = S.tool === 'door' ? 80 : 120;
    const tmp = { kind: S.tool, width: Math.min(def, AS.wallLen(w) - 2), t: ED.hover.t, type: S.tool === 'door' ? 'giro' : 'correr', side: ED.hover.side, hinge: 'a' };
    ctx.globalAlpha = 0.7; R2.drawOpening(ctx, tmp, w, v, { ...C, ink: C.accent, paper: C.paper }, false, false, AS.floor()); ctx.globalAlpha = 1;
  }
  // divisão
  if (S.tool === 'split' && ED.hover?.wall) { const q = S2(ED.hover.p); ctx.strokeStyle = C.sel; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(q.x - 7, q.y - 7); ctx.lineTo(q.x + 7, q.y + 7); ctx.moveTo(q.x + 7, q.y - 7); ctx.lineTo(q.x - 7, q.y + 7); ctx.stroke(); }
  // móvel em posicionamento
  if (S.tool === 'furniture' && ED.placing) {
    const d = AS.furnDef(ED.placing.type), sp = ED.snapInfo?.p || P;
    ctx.globalAlpha = 0.6; R2.drawFurniture(ctx, { ...d, x: sp.x, y: sp.y, rot: ED.placing.rot }, v, { ...C, muted: C.accent }, false, false); ctx.globalAlpha = 1;
  }
  // seleção em janela
  if (ED.drag?.type === 'marquee') {
    const a = S2(ED.drag.start), b = S2(P);
    ctx.fillStyle = C.accent; ctx.globalAlpha = 0.08; ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y); ctx.globalAlpha = 1;
    ctx.strokeStyle = C.accent; ctx.setLineDash([4, 3]); ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y); ctx.setLineDash([]);
  }
};

/* ---------- Entrada numérica de comprimento ---------- */
ED.showNumInput = (initial = '') => {
  const box = document.getElementById('numInput'), inp = document.getElementById('numInputField');
  const q = R2.toScreen(ED.pointer.w);
  box.hidden = false; box.style.left = Math.min(R2.w - 190, q.x + 18) + 'px'; box.style.top = Math.max(4, q.y - 44) + 'px';
  document.getElementById('numInputUnit').textContent = AS.units.mode;
  inp.value = initial; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
};
ED.hideNumInput = () => { const b = document.getElementById('numInput'); if (b) b.hidden = true; };
ED.applyNumInput = () => {
  const inp = document.getElementById('numInputField');
  const L = AS.units.parse(inp.value);
  ED.hideNumInput(); R2.canvas.focus();
  if (!isFinite(L) || L <= 0) return AS.toast('Comprimento inválido. Exemplos: 3,5 · 350cm · 3m50', 'err');
  if (S.tool === 'wall' && ED.chain) {
    const tgt = ED.snapInfo?.p || ED.pointer.w;
    let d = AS.geo.sub(tgt, ED.chain.last); if (AS.geo.len(d) < 0.01) d = { x: 1, y: 0 };
    d = AS.geo.norm(d);
    const b = AS.geo.add(ED.chain.last, AS.geo.mul(d, L));
    ED.commitWallSegment(ED.chain.last, { x: Math.round(b.x * 10) / 10, y: Math.round(b.y * 10) / 10 });
  }
};

ED.commitWallSegment = (a, b) => {
  if (AS.geo.dist(a, b) < 2) return;
  AS.history.run('Desenhar parede', () => {
    const w = AS.addWall(a, b);
    // conecta em T dividindo a parede atingida (mantém topologia limpa)
    for (const p of [a, b]) for (const v of AS.floor().walls) {
      if (v === w) continue; const L = AS.wallLen(v), pr = AS.geo.projSeg(p, v.a, v.b);
      if (pr.d < 0.6 && pr.t * L > 2 && pr.t * L < L - 2) { AS.splitWall(v, pr.t * L); break; }
    }
  });
  const closes = ED.chain && AS.geo.eq(b, ED.chain.start, 0.6);
  if (closes) { ED.chain = null; AS.toast('Contorno fechado'); }
  else ED.chain = { start: ED.chain?.start || a, last: b };
};

/* ---------- Ponteiro ---------- */
ED.onDown = (e) => {
  R2.canvas.focus();
  R2.canvas.setPointerCapture(e.pointerId);
  ED.pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (ED.pointers.size === 2) { // pinça
    const [p1, p2] = [...ED.pointers.values()];
    ED.drag = { type: 'pinch', d0: Math.hypot(p1.x - p2.x, p1.y - p2.y), s0: R2.view.s, c: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, v0: { ...R2.view } };
    return;
  }
  const p = R2.toWorld(e.offsetX, e.offsetY);
  ED.pointer = { x: e.offsetX, y: e.offsetY, w: p };
  if (e.button === 1 || e.button === 0 && (ED.spaceDown || S.tool === 'pan')) { ED.drag = { type: 'pan', sx: e.offsetX, sy: e.offsetY, ox: R2.view.ox, oy: R2.view.oy }; R2.canvas.style.cursor = 'grabbing'; return; }
  if (e.button === 2) return;
  const free = e.shiftKey && S.tool !== 'select';
  const tool = S.tool;
  if (tool === 'wall') {
    const sp = ED.snap(p, { from: ED.chain?.last, free }).p;
    if (!ED.chain) { ED.chain = { start: sp, last: sp }; }
    else ED.commitWallSegment(ED.chain.last, sp);
    R2.req(); return;
  }
  if (tool === 'room') { const sp = ED.snap(p, { free }).p; if (!ED.rectStart) { ED.rectStart = sp; ED.drag = { type: 'rect' }; } else ED.finishRect(sp); return; }
  if (tool === 'measure') {
    const sp = ED.snap(p, { free, from: ED.measureStart }).p;
    if (!ED.measureStart) ED.measureStart = sp;
    else { const a = ED.measureStart; ED.measureStart = null; if (AS.geo.dist(a, sp) > 1) AS.history.run('Cota', () => AS.floor().dims.push({ id: AS.uid('dm'), a, b: sp, off: 0 })); }
    R2.req(); return;
  }
  if (tool === 'calibrate') {
    const sp = ED.snap(p, { free: true }).p; ED.calib.pts.push(sp);
    if (ED.calib.pts.length === 2) AS.bus.emit('calibrate', ED.calib.pts.slice());
    R2.req(); return;
  }
  if (tool === 'bgmove') { const bg = AS.floor().bg; if (bg) ED.drag = { type: 'bg', start: p, x0: bg.x, y0: bg.y }; return; }
  if (tool === 'door' || tool === 'window') {
    const h = ED.wallUnder(p); if (!h) return AS.toast('Clique sobre uma parede');
    let o; AS.history.run(tool === 'door' ? 'Adicionar porta' : 'Adicionar janela', () => { o = AS.addOpening(tool, h.wall, AS.round(h.t, 5), { side: h.side }); });
    ED.select([{ kind: 'opening', id: o.id }]); return;
  }
  if (tool === 'split') { const h = ED.wallUnder(p); if (!h) return; AS.history.run('Dividir parede', () => AS.splitWall(h.wall, AS.round(h.t, 1))); return; }
  if (tool === 'furniture' && ED.placing) {
    const sp = ED.snapInfo?.p || p; let f;
    AS.history.run('Adicionar móvel', () => { f = AS.addFurniture(ED.placing.type, Math.round(sp.x), Math.round(sp.y), ED.placing.rot); });
    if (!e.altKey) { ED.setTool('select'); ED.select([{ kind: 'furniture', id: f.id }]); }
    return;
  }
  // ---- seleção ----
  const hit = ED.hit(p);
  if (!hit) { if (!e.shiftKey) ED.select([]); ED.drag = { type: 'marquee', start: p, add: e.shiftKey }; return; }
  if (hit.kind === 'handle') { AS.history.begin(); ED.drag = { type: 'endpoint', wall: hit.wall, end: hit.end, joined: AS.wallsAt(hit.wall[hit.end], AS.floor(), 1, hit.wall.id).filter(j => !j.w.locked), moved: false }; return; }
  if (hit.kind === 'rotate') { AS.history.begin(); ED.drag = { type: 'rotate', f: hit.f }; return; }
  if (hit.kind === 'resize') { AS.history.begin(); ED.drag = { type: 'resize', f: hit.f }; return; }
  if (hit.kind === 'ohandle') { AS.history.begin(); ED.drag = { type: 'owidth', o: hit.o, w: hit.w, end: hit.end }; return; }
  let item = hit.kind === 'room' ? { kind: 'room', id: AS.ensureRoomMetaLazy(hit.room) } : { kind: hit.kind, id: hit.id };
  const already = S.sel.some(s => s.kind === item.kind && s.id === item.id);
  if (e.shiftKey) ED.select([item], true);
  else if (!already) ED.select([item]);
  // arraste da seleção
  AS.history.begin();
  ED.drag = { type: 'move', start: p, last: p, moved: false, snapStart: hit.kind === 'wall' ? null : null };
  ED.prepareMove();
};
AS.ensureRoomMetaLazy = (room) => { if (room.meta) return room.meta.id; let id; AS.history.run('Identificar cômodo', () => { id = AS.ensureRoomMeta(room).id; }); return id; };

ED.prepareMove = () => {
  const fl = AS.floor();
  const wallIds = new Set(ED.selected('wall').filter(s => !s.o.locked).map(s => s.id));
  // pontos a mover: extremidades das paredes selecionadas + extremidades coincidentes de outras paredes
  const pts = [];
  for (const id of wallIds) { const w = AS.find('wall', id); pts.push({ w, e: 'a', o: { ...w.a } }, { w, e: 'b', o: { ...w.b } }); }
  const joined = [];
  for (const w of fl.walls) {
    if (wallIds.has(w.id) || w.locked) continue;
    for (const e of ['a', 'b']) for (const id of wallIds) { const s = AS.find('wall', id); if (G2.eq(w[e], s.a, 1) || G2.eq(w[e], s.b, 1)) { joined.push({ w, e, o: { ...w[e] } }); break; } }
  }
  ED.drag.walls = pts; ED.drag.joined = joined;
  ED.drag.furn = ED.selected('furniture').filter(s => !s.o.locked).map(s => ({ f: s.o, x: s.o.x, y: s.o.y }));
  ED.drag.opens = ED.selected('opening').filter(s => !s.o.locked).map(s => ({ o: s.o, t: s.o.t, wallId: s.o.wallId }));
  ED.drag.rooms = ED.selected('room').map(s => ({ m: s.o, a: { ...s.o.anchor }, l: s.o.labelPos ? { ...s.o.labelPos } : null }));
  ED.drag.dims = ED.selected('dim').map(s => ({ d: s.o, a: { ...s.o.a }, b: { ...s.o.b } }));
  ED.drag.excl = wallIds;
  // referência de snap: primeira extremidade de parede selecionada
  ED.drag.ref = pts[0] ? { ...pts[0].o } : null;
};

ED.wallUnder = (p, tolPx = 14) => {
  const fl = AS.floor(); let best = null;
  for (const w of fl.walls) {
    if (w.hidden) continue; const pr = AS.geo.projSeg(p, w.a, w.b);
    if (pr.d < w.thickness / 2 + tolPx / R2.view.s && (!best || pr.d < best.d)) {
      const n = AS.geo.perp(AS.wallDir(w));
      best = { wall: w, t: pr.t * AS.wallLen(w), d: pr.d, p: pr.p, side: Math.sign(AS.geo.dot(AS.geo.sub(p, pr.p), n)) || 1 };
    }
  }
  return best;
};

ED.onMove = (e) => {
  if (ED.pointers.has(e.pointerId)) ED.pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  const p = R2.toWorld(e.offsetX, e.offsetY);
  ED.pointer = { x: e.offsetX, y: e.offsetY, w: p };
  AS.bus.emit('pointer', p);
  const d = ED.drag, free = e.shiftKey;
  if (d?.type === 'pinch' && ED.pointers.size === 2) {
    const [p1, p2] = [...ED.pointers.values()], dist = Math.hypot(p1.x - p2.x, p1.y - p2.y), c = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    Object.assign(R2.view, d.v0); const wc = R2.toWorld(d.c.x, d.c.y);
    R2.view.s = AS.clamp(d.s0 * dist / d.d0, 0.02, 10); R2.view.ox = c.x - wc.x * R2.view.s; R2.view.oy = c.y - wc.y * R2.view.s; R2.req(); return;
  }
  if (d?.type === 'pan') { R2.view.ox = d.ox + e.offsetX - d.sx; R2.view.oy = d.oy + e.offsetY - d.sy; R2.req(); AS.bus.emit('view'); return; }
  const tool = S.tool;
  if (tool === 'wall') { ED.snapInfo = ED.snap(p, { from: ED.chain?.last, free }); R2.req(); return; }
  if (tool === 'room' || tool === 'measure' || tool === 'calibrate') { ED.snapInfo = ED.snap(p, { free: free || tool === 'calibrate', from: tool === 'measure' ? ED.measureStart : null }); R2.req(); return; }
  if (tool === 'door' || tool === 'window' || tool === 'split') { ED.hover = ED.wallUnder(p); R2.req(); return; }
  if (tool === 'furniture') { const g = S.project.settings.snapGrid ? 5 : 1; ED.snapInfo = { p: { x: AS.round(p.x, g), y: AS.round(p.y, g) } }; R2.req(); return; }
  if (!d) { // hover para cursor
    const h = ED.hit(p);
    R2.canvas.style.cursor = !h ? 'default' : h.kind === 'handle' || h.kind === 'resize' || h.kind === 'ohandle' ? 'pointer' : h.kind === 'rotate' ? 'alias' : 'move';
    return;
  }
  if (d.type === 'bg') { const bg = AS.floor().bg; bg.x = d.x0 + p.x - d.start.x; bg.y = d.y0 + p.y - d.start.y; R2.req(); return; }
  if (d.type === 'marquee') { R2.req(); return; }
  if (d.type === 'endpoint') {
    const w = d.wall, other = d.end === 'a' ? w.b : w.a;
    const sn = ED.snap(p, { from: other, free, excludeWall: new Set([w.id, ...d.joined.map(j => j.w.id)]) }); ED.snapInfo = sn;
    const np = sn.p; if (AS.geo.dist(np, other) < 2) return;
    w[d.end] = { ...np }; for (const j of d.joined) j.w[j.e] = { ...np };
    d.moved = true; AS.fixOpenings(); ED.liveChanged(); return;
  }
  if (d.type === 'rotate') { const f = d.f; let a = AS.deg(Math.atan2(p.y - f.y, p.x - f.x)) + 90; if (!free) a = AS.round(a, 15); f.rot = ((a % 360) + 360) % 360; ED.liveChanged(); return; }
  if (d.type === 'resize') { const f = d.f; const loc = AS.geo.rot({ x: p.x - f.x, y: p.y - f.y }, -AS.rad(f.rot || 0)); f.w = Math.max(10, AS.round(Math.abs(loc.x) * 2, free ? 1 : 5)); f.d = Math.max(10, AS.round(Math.abs(loc.y) * 2, free ? 1 : 5)); ED.liveChanged(); return; }
  if (d.type === 'owidth') {
    const o = d.o, w = d.w, L = AS.wallLen(w), t = AS.geo.projSeg(p, w.a, w.b).t * L;
    const fixedEnd = d.end === 0 ? o.t + o.width / 2 : o.t - o.width / 2;
    let nw = AS.round(Math.abs(fixedEnd - t), free ? 1 : 5); nw = AS.clamp(nw, 30, L - 2);
    o.width = nw; o.t = d.end === 0 ? fixedEnd - nw / 2 : fixedEnd + nw / 2; AS.fixOpenings(); ED.liveChanged(); return;
  }
  if (d.type === 'move') {
    let delta = AS.geo.sub(p, d.start);
    if (!d.moved && AS.geo.len(delta) * R2.view.s < 3) return;
    d.moved = true;
    // snap da referência
    if (d.ref && !free) { const sn = ED.snap(AS.geo.add(d.ref, delta), { excludeWall: d.excl }); ED.snapInfo = sn; delta = AS.geo.sub(sn.p, d.ref); }
    else if (!free && S.project.settings.snapGrid && !d.opens.length) { const g = S.project.settings.grid; delta = { x: AS.round(delta.x, g / 2), y: AS.round(delta.y, g / 2) }; }
    for (const q of d.walls) q.w[q.e] = AS.geo.add(q.o, delta);
    for (const q of d.joined) q.w[q.e] = AS.geo.add(q.o, delta);
    for (const q of d.furn) { q.f.x = Math.round((q.x + delta.x) * 10) / 10; q.f.y = Math.round((q.y + delta.y) * 10) / 10; }
    for (const q of d.rooms) { q.m.anchor = AS.geo.add(q.a, delta); q.m.labelPos = AS.geo.add(q.l || q.a, delta); }
    for (const q of d.dims) { q.d.a = AS.geo.add(q.a, delta); q.d.b = AS.geo.add(q.b, delta); }
    if (d.opens.length && !d.walls.length) {
      // portas/janelas deslizam pela parede; podem saltar para outra parede
      for (const q of d.opens) {
        const h = ED.wallUnder(p, 20);
        if (h && h.wall.id !== q.o.wallId && d.opens.length === 1) { q.o.wallId = h.wall.id; q.o.t = h.t; q.wallId = h.wall.id; q.t = h.t; d.start = p; }
        else { const w = AS.find('wall', q.o.wallId); if (!w) continue; const dir = AS.wallDir(w); q.o.t = AS.round(q.t + AS.geo.dot(delta, dir), free ? 1 : 5); }
      }
    }
    AS.fixOpenings(); ED.liveChanged(); return;
  }
};
ED.liveChanged = AS.throttle(() => { AS.changed(true); }, 40);

ED.onUp = (e) => {
  ED.pointers.delete(e.pointerId);
  const d = ED.drag; ED.drag = null;
  if (!d) return;
  if (d.type === 'pan') { R2.canvas.style.cursor = ED.TOOLS[S.tool].cursor; return; }
  if (d.type === 'pinch') return;
  if (d.type === 'bg') { AS.history.begin(); AS.history.commit('Mover referência'); AS.bus.emit('changed', false); return; }
  if (d.type === 'rect') { const sp = ED.snapInfo?.p; if (sp && AS.geo.dist(sp, ED.rectStart) * R2.view.s > 12) ED.finishRect(sp); return; }
  if (d.type === 'marquee') {
    const p = ED.pointer.w, a = d.start; const x0 = Math.min(a.x, p.x), x1 = Math.max(a.x, p.x), y0 = Math.min(a.y, p.y), y1 = Math.max(a.y, p.y);
    if ((x1 - x0) * R2.view.s < 4) { R2.req(); return; }
    const inside = (q) => q.x >= x0 && q.x <= x1 && q.y >= y0 && q.y <= y1, fl = AS.floor(), items = [];
    for (const w of fl.walls) if (!w.hidden && inside(w.a) && inside(w.b)) items.push({ kind: 'wall', id: w.id });
    for (const f of fl.furniture) if (!f.hidden && inside(f)) items.push({ kind: 'furniture', id: f.id });
    for (const o of fl.openings) { const w = fl.walls.find(x => x.id === o.wallId); if (w && inside(R2.openingGeom(o, w).c)) items.push({ kind: 'opening', id: o.id }); }
    ED.select(items, d.add); AS.toast(`${items.length} objeto(s) selecionado(s)`); return;
  }
  ED.snapInfo = null; ED.guides = [];
  const labels = { endpoint: 'Editar extremidade da parede', rotate: 'Girar móvel', resize: 'Redimensionar móvel', owidth: 'Redimensionar abertura', move: 'Mover seleção' };
  if (d.type === 'move' && !d.moved) { AS.history.pending = null; return; }
  if (d.type === 'endpoint') { // conecta em T se soltar sobre parede
    const w = d.wall, p = w[d.end];
    for (const v of AS.floor().walls) { if (v === w || d.joined.some(j => j.w === v)) continue; const L = AS.wallLen(v), pr = AS.geo.projSeg(p, v.a, v.b); if (pr.d < 0.6 && pr.t * L > 2 && pr.t * L < L - 2) { AS.splitWall(v, pr.t * L); break; } }
  }
  AS.history.commit(labels[d.type] || 'Editar');
  R2.req();
};

ED.finishRect = (b) => {
  const a = ED.rectStart; ED.rectStart = null;
  if (Math.abs(b.x - a.x) < 30 || Math.abs(b.y - a.y) < 30) { AS.toast('Cômodo muito pequeno (mínimo 30 cm)', 'err'); R2.req(); return; }
  const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x), y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
  const pts = [{ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }];
  AS.history.run('Desenhar cômodo', () => {
    const fl = AS.floor();
    for (let i = 0; i < 4; i++) {
      const p = pts[i], q = pts[(i + 1) % 4];
      // evita duplicar paredes existentes exatamente coincidentes
      const exists = fl.walls.some(w => (G2.eq(w.a, p, 1) && G2.eq(w.b, q, 1)) || (G2.eq(w.a, q, 1) && G2.eq(w.b, p, 1)));
      if (!exists) AS.addWall(p, q);
    }
    AS.addRoomMeta({ x: (x0 + x1) / 2, y: (y0 + y1) / 2 }, 'Cômodo', 'outro');
  });
  R2.req();
};

ED.onWheel = (e) => {
  e.preventDefault();
  if (e.ctrlKey || !e.shiftKey && Math.abs(e.deltaY) >= Math.abs(e.deltaX)) ED.zoomWheel(e);
  else { R2.view.ox -= e.deltaX || e.deltaY; R2.req(); }
};
ED.zoomWheel = (e) => { const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)); R2.zoomAt(f, e.offsetX, e.offsetY); };

ED.onDbl = () => { if (S.tool === 'wall' && ED.chain) { ED.chain = null; AS.toast('Desenho de paredes encerrado'); R2.req(); } else if (S.tool === 'select') { const h = ED.hit(ED.pointer.w, { noHandles: true }); if (h?.kind === 'room') AS.bus.emit('focusProp', 'name'); } };

/* ---------- Operações sobre a seleção ---------- */
ED.ops = {
  delete() {
    if (!S.sel.length) return;
    const n = S.sel.length;
    AS.history.run('Excluir', () => {
      const fl = AS.floor(), ids = new Set(S.sel.filter(s => !AS.find(s.kind, s.id)?.locked).map(s => s.id));
      fl.walls = fl.walls.filter(w => !ids.has(w.id));
      fl.openings = fl.openings.filter(o => !ids.has(o.id) && fl.walls.some(w => w.id === o.wallId));
      fl.furniture = fl.furniture.filter(f => !ids.has(f.id));
      fl.roomMeta = fl.roomMeta.filter(m => !ids.has(m.id));
      fl.dims = fl.dims.filter(d => !ids.has(d.id));
    });
    ED.select([]); AS.toast(`${n} objeto(s) excluído(s)`);
  },
  copy() {
    if (!S.sel.length) return;
    const fl = AS.floor(), sel = new Set(S.sel.map(s => s.id));
    const walls = fl.walls.filter(w => sel.has(w.id));
    const wIds = new Set(walls.map(w => w.id));
    S.clipboard = AS.clone({ walls, furniture: fl.furniture.filter(f => sel.has(f.id)), openings: fl.openings.filter(o => wIds.has(o.wallId) || sel.has(o.id)), dims: fl.dims.filter(d => sel.has(d.id)) });
    AS.toast(`${S.sel.length} objeto(s) copiado(s)`);
  },
  paste(offset = 50) {
    const cb = S.clipboard; if (!cb) return AS.toast('Área de transferência vazia');
    const items = [];
    AS.history.run('Colar', () => {
      const fl = AS.floor(), map = {};
      for (const w of cb.walls) { const n = AS.clone(w); n.id = AS.uid('w'); map[w.id] = n.id; n.a.x += offset; n.a.y += offset; n.b.x += offset; n.b.y += offset; n.groupId = null; fl.walls.push(n); items.push({ kind: 'wall', id: n.id }); }
      for (const o of cb.openings) { const n = AS.clone(o); n.id = AS.uid('op'); if (map[o.wallId]) n.wallId = map[o.wallId]; else { n.t += offset; } if (!fl.walls.some(w => w.id === n.wallId)) continue; fl.openings.push(n); items.push({ kind: 'opening', id: n.id }); }
      for (const f of cb.furniture) { const n = AS.clone(f); n.id = AS.uid('fu'); n.x += offset; n.y += offset; n.groupId = null; fl.furniture.push(n); items.push({ kind: 'furniture', id: n.id }); }
      for (const d of cb.dims) { const n = AS.clone(d); n.id = AS.uid('dm'); n.a.x += offset; n.a.y += offset; n.b.x += offset; n.b.y += offset; fl.dims.push(n); items.push({ kind: 'dim', id: n.id }); }
      AS.fixOpenings();
    });
    ED.select(items);
  },
  duplicate() { ED.ops.copy(); ED.ops.paste(50); },
  rotate90() {
    const sel = ED.selected().filter(s => !s.o.locked); if (!sel.length) return;
    const pts = [];
    for (const s of sel) { if (s.kind === 'wall') pts.push(s.o.a, s.o.b); if (s.kind === 'furniture') pts.push(s.o); }
    if (!pts.length) return;
    const b = AS.geo.bbox(pts), c = { x: b.x0 + b.w / 2, y: b.y0 + b.h / 2 };
    AS.history.run('Girar 90°', () => {
      for (const s of sel) {
        if (s.kind === 'wall') { s.o.a = AS.geo.rot(s.o.a, Math.PI / 2, c); s.o.b = AS.geo.rot(s.o.b, Math.PI / 2, c); }
        if (s.kind === 'furniture') { const q = sel.length > 1 ? AS.geo.rot(s.o, Math.PI / 2, c) : s.o; s.o.x = q.x; s.o.y = q.y; s.o.rot = ((s.o.rot || 0) + 90) % 360; }
      }
    });
  },
  flip() { const ops = ED.selected('opening'); if (!ops.length) return; AS.history.run('Inverter abertura', () => ops.forEach(s => { if (s.o.side === 1 && s.o.hinge === 'a') s.o.hinge = 'b'; else if (s.o.hinge === 'b' && s.o.side === 1) { s.o.side = -1; } else if (s.o.side === -1 && s.o.hinge === 'b') s.o.hinge = 'a'; else { s.o.side = 1; } })); },
  group() {
    const sel = ED.selected().filter(s => s.kind === 'wall' || s.kind === 'furniture'); if (sel.length < 2) return AS.toast('Selecione 2 ou mais paredes/móveis para agrupar');
    const g = AS.uid('g'); AS.history.run('Agrupar', () => sel.forEach(s => { s.o.groupId = g; })); AS.toast(`Grupo criado com ${sel.length} objetos`);
  },
  ungroup() { const sel = ED.selected().filter(s => s.o.groupId); if (!sel.length) return; AS.history.run('Desagrupar', () => sel.forEach(s => { s.o.groupId = null; })); AS.toast('Grupo desfeito'); },
  lock() { const sel = ED.selected(); if (!sel.length) return; const v = !sel.every(s => s.o.locked); AS.history.run(v ? 'Bloquear' : 'Desbloquear', () => sel.forEach(s => { s.o.locked = v; })); AS.toast(v ? 'Objetos bloqueados' : 'Objetos desbloqueados'); },
  hide() { const sel = ED.selected(); if (!sel.length) return; AS.history.run('Ocultar', () => sel.forEach(s => { s.o.hidden = true; })); ED.select([]); AS.toast('Objetos ocultos — "Mostrar ocultos" no menu de contexto'); },
  showAll() { AS.history.run('Mostrar ocultos', () => { const fl = AS.floor(); [...fl.walls, ...fl.openings, ...fl.furniture].forEach(o => { o.hidden = false; }); }); },
  selectAll() { const fl = AS.floor(); ED.select([...fl.walls.map(w => ({ kind: 'wall', id: w.id })), ...fl.furniture.map(f => ({ kind: 'furniture', id: f.id })), ...fl.openings.map(o => ({ kind: 'opening', id: o.id }))]); },
  nudge(dx, dy) {
    const sel = ED.selected().filter(s => !s.o.locked); if (!sel.length) return;
    AS.history.begin(); ED.drag = { start: { x: 0, y: 0 } }; ED.prepareMove(); const d = ED.drag; ED.drag = null;
    for (const q of d.walls) q.w[q.e] = AS.geo.add(q.o, { x: dx, y: dy });
    for (const q of d.joined) q.w[q.e] = AS.geo.add(q.o, { x: dx, y: dy });
    for (const q of d.furn) { q.f.x += dx; q.f.y += dy; }
    for (const q of d.opens) { const w = AS.find('wall', q.o.wallId); if (w) q.o.t += AS.geo.dot({ x: dx, y: dy }, AS.wallDir(w)); }
    for (const q of d.dims) { q.d.a = AS.geo.add(q.a, { x: dx, y: dy }); q.d.b = AS.geo.add(q.b, { x: dx, y: dy }); }
    AS.fixOpenings(); AS.history.commit('Mover (teclado)');
  },
  splitMid() { const ws = ED.selected('wall'); if (!ws.length) return; AS.history.run('Dividir parede ao meio', () => ws.forEach(s => AS.splitWall(s.o, AS.wallLen(s.o) / 2))); },
  merge() { const ws = ED.selected('wall'); if (ws.length !== 2) return AS.toast('Selecione exatamente 2 paredes colineares conectadas', 'err'); AS.history.run('Unir paredes', () => AS.mergeWalls(ws[0].o, ws[1].o)); ED.select([{ kind: 'wall', id: ws[0].id }]); },
};

/* ---------- Teclado ---------- */
ED.onKey = (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) {
    if (e.target.id === 'numInputField') { if (e.key === 'Enter') { e.preventDefault(); ED.applyNumInput(); } if (e.key === 'Escape') { ED.hideNumInput(); R2.canvas.focus(); } }
    return;
  }
  if (!document.getElementById('modal').hidden) { if (e.key === 'Escape') AS.ui.closeModal(); return; }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); return AS.history.doUndo(); }
  if (mod && (k === 'y' || k === 'z' && e.shiftKey)) { e.preventDefault(); return AS.history.doRedo(); }
  if (mod && k === 'c') { e.preventDefault(); return ED.ops.copy(); }
  if (mod && k === 'v') { e.preventDefault(); return ED.ops.paste(); }
  if (mod && k === 'd') { e.preventDefault(); return ED.ops.duplicate(); }
  if (mod && k === 'a') { e.preventDefault(); return ED.ops.selectAll(); }
  if (mod && k === 'g') { e.preventDefault(); return e.shiftKey ? ED.ops.ungroup() : ED.ops.group(); }
  if (mod && k === 's') { e.preventDefault(); return AS.storage.saveCurrent(true); }
  if (mod && k === 'l') { e.preventDefault(); return ED.ops.lock(); }
  if (mod) return;

    mesh.userData = r.meta ? { kind: 'room', id: r.meta.id, floorId: fl.id } : { kind: 'roomraw', floorId: fl.id }; V3.pickables.push(mesh); g.add(mesh);
    if (vs.ceilings && !vs.cutaway && r.meta?.type !== 'varanda') {
      const c = new THREE.Mesh(geo.clone(), V3.material('pint_branca', { side: THREE.DoubleSide, noTex: true })); c.position.y = (fl.height || 280) / 100; c.receiveShadow = true; g.add(c);
    }
  }
  // laje/base sob as paredes externas (contorno simples por bbox dos cômodos)
  if (rooms.length && (fl.elevation || 0) > 0) {
    for (const r of rooms) { const shape = new THREE.Shape(r.poly.map(q => new THREE.Vector2(q.x / 100, q.y / 100))); const geo = new THREE.ExtrudeGeometry(shape, { depth: (fl.slab || 12) / 100, bevelEnabled: false }); geo.rotateX(Math.PI / 2); const mesh = new THREE.Mesh(geo, V3.material('concreto', { noTex: true })); mesh.position.y = 0; mesh.receiveShadow = true; mesh.castShadow = true; g.add(mesh); }
  }
  // paredes com recortes reais das aberturas
  for (const w of fl.walls) {
    if (w.hidden) continue;
    const L = AS.wallLen(w); if (L < 1) continue;
    const ext = R2.wallExt(w, fl);
    const dir = AS.wallDir(w), ang = Math.atan2(dir.y, dir.x);
    const H = Math.min(w.height, cut ? cut * 100 : Infinity) / 100, T = w.thickness / 100;
    const ops = fl.openings.filter(o => o.wallId === w.id && !o.hidden).map(o => ({ o, s: o.t - o.width / 2, e: o.t + o.width / 2 })).sort((a, b) => a.s - b.s);
    const grp = new THREE.Group();
    const origin = AS.geo.sub(w.a, AS.geo.mul(dir, ext.a));
    grp.position.set(origin.x / 100, 0, origin.y / 100); grp.rotation.y = -ang; g.add(grp);
    const total = L + ext.a + ext.b;
    const data = { kind: 'wall', id: w.id, floorId: fl.id };
    const matId = w.material || 'pint_branca';
    // segmentos ao longo da parede (coordenadas locais, em cm a partir da origem estendida)
    let x = 0;
    const seg = (x0, x1, y0, y1) => { if (x1 - x0 < 0.2 || y1 - y0 < 0.2) return; V3.box((x1 - x0) / 100, (y1 - y0) / 100, T, matId, grp, { x: (x0 + x1) / 200, y: (y0 + y1) / 200, z: 0 }, 0, data); };
    for (const { o, s, e } of ops) {
      const S0 = s + ext.a, E0 = e + ext.a;
      seg(x, S0, 0, H * 100);
      const sill = o.kind === 'window' ? o.sill : 0, top = sill + o.height;
      if (sill > 0) seg(S0, E0, 0, Math.min(sill, H * 100));
      if (top < H * 100) seg(S0, E0, top, H * 100);
      x = E0;
      V3.buildOpening(o, grp, S0, E0, T, sill, Math.min(top, H * 100), fl);

    seg(x, total, 0, H * 100);
    // face externa diferente (material externo) — fina camada

      const c = R2._center || { x: 0, y: 0 };
      const n = AS.geo.perp(dir), mid = AS.geo.lerp(w.a, w.b, 0.5), outSide = AS.geo.dot(AS.geo.sub(mid, c), n) > 0 ? 1 : -1;

      for (const { o, s, e } of ops) { const S0 = s + ext.a, E0 = e + ext.a; skin(x, S0, 0, H * 100); const sill = o.kind === 'window' ? o.sill : 0, top = sill + o.height; if (sill > 0) skin(S0, E0, 0, sill); if (top < H * 100) skin(S0, E0, top, H * 100); x = E0; }

  if (S.project.settings.showFurniture) for (const f of fl.furniture) if (!f.hidden) V3.buildFurniture(f, g, fl);

V3.buildOpening = (o, grp, S0, E0, T, sill, top, fl) => {
  const w = (E0 - S0) / 100, cx = (S0 + E0) / 200, data = { kind: 'opening', id: o.id, floorId: fl.id };
  const frame = o.frame || (o.kind === 'door' ? 'mad_freijo' : 'aluminio');
  const fT = 0.04, h = (top - sill) / 100, y0 = sill / 100;
  if (h <= 0.01) return;
  // marco
  if (o.type !== 'passagem') {
    V3.box(fT, h, T + 0.01, frame, grp, { x: S0 / 100 + fT / 2, y: y0 + h / 2, z: 0 }, 0, data);
    V3.box(fT, h, T + 0.01, frame, grp, { x: E0 / 100 - fT / 2, y: y0 + h / 2, z: 0 }, 0, data);
    V3.box(w, fT, T + 0.01, frame, grp, { x: cx, y: y0 + h - fT / 2, z: 0 }, 0, data);
    if (o.kind === 'window') V3.box(w, fT, T + 0.03, frame, grp, { x: cx, y: y0 + fT / 2, z: 0 }, 0, data);
  }
  if (o.kind === 'window') {
    const panes = o.type === 'correr' ? 2 : 1;
    for (let i = 0; i < panes; i++) {
      const pw = (w - fT * 2) / panes, px = S0 / 100 + fT + pw * (i + 0.5), pz = panes === 2 ? (i ? 0.012 : -0.012) : 0;
      V3.box(pw + (panes === 2 ? 0.03 : 0), h - fT * 2, 0.01, o.material || 'vidro', grp, { x: px, y: y0 + h / 2, z: pz }, 0, data, { cast: false });
      V3.box(0.025, h - fT * 2, 0.03, frame, grp, { x: px - pw / 2, y: y0 + h / 2, z: pz }, 0, data);
    }
  } else if (o.type === 'giro' || o.type === 'dupla') {
    const leaves = o.type === 'dupla' ? 2 : 1, lw = (w - fT * 2) / leaves;
    for (let i = 0; i < leaves; i++) {
      const hingeLeft = leaves === 2 ? i === 0 : o.hinge !== 'b';
      const pivot = new THREE.Group();
      const hx = hingeLeft ? S0 / 100 + fT : E0 / 100 - fT;
      pivot.position.set(hx, y0, (o.side || 1) * (T / 2));
      const openA = AS.rad(72) * (o.side || 1) * (hingeLeft ? -1 : 1);
      pivot.rotation.y = openA; grp.add(pivot);
      V3.box(lw, h - fT - 0.01, 0.035, o.material || 'mad_freijo', pivot, { x: (hingeLeft ? 1 : -1) * lw / 2, y: (h - fT) / 2, z: 0 }, 0, data);
      V3.box(0.02, 0.02, 0.12, 'inox', pivot, { x: (hingeLeft ? 1 : -1) * (lw - 0.07), y: 1.05, z: 0 }, 0, data);
    }
  } else if (o.type === 'correr') {
    const pw = (w - fT * 2) / 2 + 0.03;
    V3.box(pw, h - fT, 0.035, o.material || 'mad_freijo', grp, { x: S0 / 100 + fT + pw / 2 + pw * 0.35, y: y0 + (h - fT) / 2, z: -T / 2 - 0.03 }, 0, data);
    if (o.material === 'vidro' || o.material === 'vidro_fume') V3.box(pw, h - fT, 0.035, o.material, grp, { x: E0 / 100 - fT - pw / 2, y: y0 + (h - fT) / 2, z: -T / 2 - 0.07 }, 0, data, { cast: false });
  }
};

V3.buildFurniture = (f, g, fl) => {
  const grp = new THREE.Group(); grp.position.set(f.x / 100, (f.elev || 0) / 100, f.y / 100); grp.rotation.y = -AS.rad(f.rot || 0); g.add(grp);

    case 'mesa_jantar4': case 'mesa_jantar6': case 'escrivaninha': case 'mesa_centro':

      break;
    case 'mesa_redonda': cyl(W / 2, 0.04, 0, H - 0.02, 0); cyl(0.05, H - 0.04, 0, (H - 0.04) / 2, 0, 'aluminio_preto'); break;
    case 'cadeira': B(W, 0.04, D, 0, 0.46, 0); B(W, 0.42, 0.03, 0, 0.68, -D / 2 + 0.015); legs(W, D, 0.44, 0.015); break;
    case 'banqueta': cyl(W / 2, 0.05, 0, H - 0.025, 0); cyl(0.03, H - 0.05, 0, (H - 0.05) / 2, 0, 'aluminio_preto'); break;
    case 'guarda_roupa': case 'armario_alto': case 'estante': case 'rack': case 'armario_coz': case 'criado': {

      const n = Math.max(1, Math.round(f.w / 50));
      for (let i = 1; i < n; i++) B(0.006, H * 0.96, 0.005, -W / 2 + W * i / n, H / 2, D / 2 + 0.003, 'aluminio_preto');
      if (f.type === 'armario_coz') B(W + 0.02, 0.03, D + 0.02, 0, H + 0.015, 0, 'granito_preto');

    case 'fogao': B(W, H, D, 0, H / 2, 0); for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) cyl(0.05, 0.02, x * W * 0.23, H + 0.01, z * D * 0.22, 'granito_preto'); break;
    case 'cooktop': B(W, 0.02, D, 0, H, 0, 'granito_preto'); break;
    case 'pia_coz': case 'lavatorio': case 'tanque':

      B(Math.min(W * 0.5, 0.5), 0.01, D * 0.6, 0, H + 0.001, 0, 'inox'); cyl(0.012, 0.25, 0, H + 0.12, -D / 2 + 0.06, 'inox'); break;
    case 'maq_lavar': B(W, H, D, 0, H / 2, 0); cyl(0.2, 0.02, 0, H * 0.5, D / 2, 'vidro_fume').rotation.x = Math.PI / 2; break;
    case 'box': B(W, 0.04, D, 0, 0.02, 0, 'ceram_branca'); B(W, H, 0.01, 0, H / 2, D / 2, 'vidro'); B(0.01, H, D, W / 2, H / 2, 0, 'vidro'); cyl(0.1, 0.02, 0, 2.05, -D / 2 + 0.15, 'inox'); break;
    case 'vaso': B(W * 0.9, 0.38, D * 0.55, 0, 0.19, D * 0.15, 'loucas'); B(W, 0.35, 0.18, 0, 0.55, -D / 2 + 0.09, 'loucas'); break;
    case 'banheira': B(W, H, D, 0, H / 2, 0, 'loucas'); B(W - 0.1, 0.02, D - 0.1, 0, H - 0.01, 0, 'ceram_branca'); break;
    case 'planta': cyl(W * 0.3, 0.4, 0, 0.2, 0, 'concreto'); { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(W * 0.55, 1), new THREE.MeshStandardMaterial({ color: 0x5c7f4b, roughness: 0.9, flatShading: true })); s.position.y = 0.4 + W * 0.6; s.scale.y = 1.3; s.castShadow = true; s.userData = data; V3.pickables.push(s); grp.add(s); } break;

/* ---------- seleção ---------- */
V3.pick = (e) => {
  const r = V3.renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(m, V3.camera);
  const hits = ray.intersectObjects(V3.pickables, false);
  const h = hits.find(x => x.object.userData.kind && x.object.userData.kind !== 'roomraw');
  if (!h) { AS.editor.select([]); return; }
  const d = h.object.userData;
  if (d.floorId && d.floorId !== S.project.activeFloor) { S.project.activeFloor = d.floorId; AS.changed(false); AS.bus.emit('floor'); }
  AS.editor.select([{ kind: d.kind, id: d.id }], e.shiftKey);
};
V3.highlight = () => {
  if (!V3.ok) return;
  const sel = new Set(S.sel.map(s => s.id));
  for (const m of V3.pickables) {
    const on = sel.has(m.userData.id);
    if (on && !m.userData._hl) { m.userData._orig = m.material; const c = m.material.clone(); c.emissive = new THREE.Color(0xff6a1a); c.emissiveIntensity = 0.35; m.material = c; m.userData._hl = true; }
    else if (!on && m.userData._hl) { m.material.dispose(); m.material = m.userData._orig; m.userData._hl = false; }
  }
  V3.needsRender = true;
};
V3.snapshot = () => { if (!V3.ok) throw new Error('3D indisponível'); V3.updateCamera(); V3.renderer.render(V3.scene, V3.camera); return V3.renderer.domElement.toDataURL('image/png'); };

/* ==========================================================================
   06 — Gerador automático de plantas (layout em faixas: íntima / circulação / social)
   Produz geometria real e editável: paredes, cômodos, portas, janelas e mobiliário.
   Estudo preliminar — NÃO substitui projeto de arquiteto habilitado.

AS.rng = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

AS.GEN_DEFAULTS = { area: 120, bedrooms: 3, bathrooms: 2, suite: true, floors: 1, kitchen: 'm', living: 'm', garage: 1, laundry: true, balcony: true, style: 'contemporaneo', accessible: false, notes: '' };

AS.generatePlan = (reqIn, variant = 0) => {
  const req = Object.assign({}, AS.GEN_DEFAULTS, reqIn);
  req.bedrooms = AS.clamp(req.bedrooms | 0, 0, 6); req.bathrooms = AS.clamp(req.bathrooms | 0, 1, 5); req.floors = AS.clamp(req.floors | 0, 1, 2);
  const rnd = AS.rng(1234 + variant * 7919 + req.bedrooms * 31 + req.area);
  const acc = !!req.accessible;
  const assumptions = [];
  const C = acc ? 120 : 100;               // largura do corredor
  const doorW = acc ? 90 : 80;
  const extT = req.style === 'compacto' ? 15 : 20, intT = req.style === 'compacto' ? 10 : 12;
  const H = 280;
  const mirror = variant % 2 === 1;
  const integrated = variant === 2 || req.style === 'contemporaneo' && variant !== 1;
  const garageRight = (variant % 3) !== 1;

  const kA = { p: 7, m: 10, g: 14 }[req.kitchen] || 10;
  const lA = { p: 12, m: 17, g: 24 }[req.living] || 17;

  // ---------- programa ----------
  const build = (k) => {
    const s = (a) => a * k;
    const beds = [];
    for (let i = 0; i < req.bedrooms; i++) {
      const suite = req.suite && i === 0 && req.bathrooms >= 2;
      beds.push({ name: suite ? 'Suíte' : `Quarto ${req.suite && req.bathrooms >= 2 ? i : i + 1}`, type: suite ? 'suite' : 'quarto', area: s(suite ? 13 : 9.5), suite });
    }
    const baths = [];
    const nb = req.bathrooms;
    const hasSuite = beds.some(b => b.suite);
    for (let i = 0; i < nb; i++) baths.push({ name: i === 0 && hasSuite ? 'Banho suíte' : (nb > 1 && hasSuite ? `Banho social${nb > 2 ? ' ' + i : ''}` : `Banheiro${nb > 1 ? ' ' + (i + 1) : ''}`), type: 'banheiro', suiteBath: i === 0 && hasSuite });
    const social = [];
    if (integrated) social.push({ name: 'Estar / Jantar', type: 'sala', area: s(lA + 8) });
    else { social.push({ name: 'Sala de estar', type: 'sala', area: s(lA) }); social.push({ name: 'Sala de jantar', type: 'jantar', area: s(9) }); }
    social.push({ name: 'Cozinha', type: 'cozinha', area: s(kA) });
    if (req.laundry) social.push({ name: 'Lavanderia', type: 'lavanderia', area: s(4), minW: 170 });
    return { beds, baths, social };
  };

  // ---------- montagem de retângulos ----------
  const layout = (k) => {
    const prog = build(k);
    const rects = []; // {x0,y0,x1,y1,name,type,door:{to, ...}}
    const Dp = Math.max(300, Math.round(Math.sqrt(k) * 340 / 10) * 10);
    const bathColW = acc ? 260 : 220;
    // colunas da faixa íntima
    const cols = [];
    const bedQ = prog.beds.slice();
    if (variant === 2) bedQ.reverse();
    const bathQ = prog.baths.slice();
    const suiteIdx = bedQ.findIndex(b => b.suite);
    const pushBed = (b) => cols.push({ w: Math.max(260, Math.round(b.area * 1e4 / Dp / 10) * 10), rooms: [{ ...b, frac: 1 }] });
    const pushBathCol = (pairWithSuite) => {
      const a = bathQ.shift(); if (!a) return;
      let b = bathQ.length ? bathQ.shift() : null;
      if (a.suiteBath) { // banho suíte no fundo, social (ou closet) junto ao corredor
        const front = b || { name: 'Closet', type: 'deposito', closet: true };
        cols.push({ w: bathColW, rooms: [{ ...a, frac: 0.5, doorSide: pairWithSuite }, { ...front, frac: 0.5 }] });
      } else if (b) cols.push({ w: bathColW, rooms: [{ ...b, frac: 0.5, doorSide: 'auto' }, { ...a, frac: 0.5 }] });
      else cols.push({ w: Math.max(170, bathColW - 40), rooms: [{ ...a, frac: 1 }] });
    };
    if (req.floors === 2) {
      // térreo: faixa de fundos com escada + lavabo + escritório/depósito
      return layout2(k, prog, Dp, bathColW);
    }
    bedQ.forEach((b, i) => {
      pushBed(b);
      if (b.suite) pushBathCol('left');
    });
    while (bathQ.length) pushBathCol('auto');
    if (!cols.length) cols.push({ w: 300, rooms: [{ name: 'Depósito', type: 'deposito', frac: 1 }] });
    let x = 0;
    for (const c of cols) {
      let y = 0;
      for (const r of c.rooms) {
        const h = Math.round(Dp * r.frac);
        // o cômodo de baixo (corredor) recebe porta para o corredor

      const spec = bath ? { width: 60, height: 60, sill: 160, type: 'maximar' } : lavd ? { width: 100, height: 80, sill: 120, type: 'basculante' } : gar ? { width: 100, height: 60, sill: 160, type: 'maximar' } : r.type === 'sala' ? { width: 200, height: 140, sill: 80, type: 'correr' } : r.type === 'cozinha' ? { width: 150, height: 100, sill: 110, type: 'correr' } : { width: 150, height: 120, sill: 100, type: 'correr' };
      for (const { e, hit } of edges) {
        const len = e.b - e.a; const wd = Math.min(spec.width, len - 60); if (wd < 50) continue;
        const free = !fl.openings.some(o => o.wallId === hit.w.id && Math.abs(o.t - hit.t) < (o.width + wd) / 2 + 10);
        if (!free) continue;
        AS.addOpening('window', hit.w, hit.t, { ...spec, width: wd }, fl); break;
      }
    }
    // 5) mobiliário ilustrativo
    for (const r of rects) furnish(fl, r);
  }

  function furnish(fl, r) {
    const ix0 = r.x0 + 10, iy0 = r.y0 + 10, ix1 = r.x1 - 10, iy1 = r.y1 - 10, w = ix1 - ix0, d = iy1 - iy0, cx = (ix0 + ix1) / 2, cy = (iy0 + iy1) / 2;
    const add = (type, x, y, rot = 0) => { const f = AS.furnDef(type); if (f.w > w + 5 && f.d > w + 5) return; AS.addFurniture(type, x, y, rot, fl); };
    const back = iy0; // fundos (lado oposto ao corredor na faixa íntima)
    switch (r.type) {
      case 'suite': case 'quarto': {
        const casal = r.type === 'suite' || w >= 300;
        const bed = casal ? AS.furnDef('cama_casal') : AS.furnDef('cama_solteiro');
        if (d < bed.d + 70 || w < bed.w + 20) break;
        add(casal ? 'cama_casal' : 'cama_solteiro', cx, back + bed.d / 2 + 2, 0);
        if (w > bed.w + 110) { add('criado', cx - bed.w / 2 - 25, back + 22, 0); add('criado', cx + bed.w / 2 + 25, back + 22, 0); }
        if (d > bed.d + 150 && w >= 210) add('guarda_roupa', cx, iy1 - 32, 180);
        break;
      }
      case 'sala': {
        if (w < 260 || d < 280) break;
        add('sofa3', cx, iy0 + 50, 0); add('mesa_centro', cx, iy0 + 145, 0);
        if (d > 360) add('rack', cx, iy1 - 25, 180);
        if (r.name.includes('Jantar') && w > 520) { add('mesa_jantar4', ix1 - 90, cy, 90); }
        break;
      }
      case 'jantar': if (w > 200 && d > 240) add('mesa_jantar4', cx, cy, w > d ? 0 : 90); break;
      case 'cozinha': {
        if (w < 180) break;
        let x = ix0 + 35; add('geladeira', x, iy0 + 37, 0); x += 35 + 5;
        if (x + 120 < ix1) { add('pia_coz', x + 60, iy0 + 30, 0); x += 125; }
        if (x + 55 < ix1) add('fogao', x + 28, iy0 + 30, 0);
        break;
      }
      case 'banheiro': {
        if (w < 140 || d < 140) break;
        add('vaso', ix0 + 25, iy0 + 33, 0);
        if (w > 200) add('lavatorio', ix0 + 95, iy0 + 25, 0);
        add('box', ix1 - 45, iy1 - 45, 0);
        break;
      }
      case 'lavanderia': if (w >= 150) { add('tanque', ix0 + 30, iy0 + 28, 0); add('maq_lavar', ix0 + 95, iy0 + 33, 0); } break;
      case 'garagem': add('carro', cx, cy, 0); break;
      case 'escritorio': if (w > 200) add('escrivaninha', cx, iy0 + 30, 0); break;
      case 'escada': AS.addFurniture('escada_reta', cx, cy, 0, fl, { w: Math.min(100, w - 10), d: Math.min(300, d - 20), h: 290 }); break;
    }
  }
};

/* ---------------- Importação de PDF / imagem ---------------- */
AS.importer = {
  doc: null, pages: [], textItems: [], fileName: '',
  async loadFile(file) {
    this.fileName = file.name;
    const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
    if (isPdf) return this.loadPdf(await file.arrayBuffer());
    if (/^image\//.test(file.type)) {
      const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
      const img = await AS.importer.loadImg(url);
      this.doc = null; this.pages = [{ n: 1, thumb: url, w: img.naturalWidth, h: img.naturalHeight, url }]; this.textItems = [];
      return { kind: 'image', pages: this.pages };
    }
    throw new Error('Formato não suportado. Use PDF, PNG, JPG ou WEBP.');
  },
  loadImg: (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Imagem inválida')); i.src = url; }),
  async loadPdf(buf) {
    const lib = window.pdfjsLib;
    if (!lib) throw new Error('O leitor de PDF (pdf.js) não carregou — sem acesso à CDN. Exporte a página do PDF como PNG/JPG e importe a imagem.');
    try { lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) { }
    const doc = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    this.doc = doc; this.pages = [];
    for (let n = 1; n <= Math.min(doc.numPages, 30); n++) {
      const page = await doc.getPage(n), vp = page.getViewport({ scale: 1 });
      const s = 180 / Math.max(vp.width, vp.height), v2 = page.getViewport({ scale: s });
      const cv = document.createElement('canvas'); cv.width = v2.width; cv.height = v2.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: v2 }).promise;
      // análise: texto e operadores vetoriais
      const tc = await page.getTextContent();
      const ops = await page.getOperatorList();
      const OPS = lib.OPS; let paths = 0, images = 0;
      for (const fn of ops.fnArray) { if (fn === OPS.constructPath) paths++; if (fn === OPS.paintImageXObject || fn === OPS.paintJpegXObject || fn === OPS.paintInlineImageXObject) images++; }
      this.pages.push({ n, thumb: cv.toDataURL('image/png'), w: vp.width, h: vp.height, text: tc.items.map(i => ({ str: i.str, x: i.transform[4], y: vp.height - i.transform[5], h: i.height })).filter(i => i.str.trim()), paths, images });
    }
    return { kind: 'pdf', pages: this.pages, numPages: doc.numPages };
  },
  /** Renderiza a página em alta resolução e devolve dataURL (JPEG para caber no armazenamento) */
  async renderPage(n, maxPx = 3000) {
    const pg = this.pages.find(p => p.n === n);
    if (!this.doc) return { url: pg.url, w: pg.w, h: pg.h, ptScale: 1 };
    const page = await this.doc.getPage(n), vp1 = page.getViewport({ scale: 1 });
    const scale = Math.min(4, maxPx / Math.max(vp1.width, vp1.height)), vp = page.getViewport({ scale });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    return { url: cv.toDataURL('image/jpeg', 0.86), w: cv.width, h: cv.height, ptScale: scale };
  },
  /** Coloca a imagem como referência no pavimento ativo. scale = cm por pixel da imagem */
  setReference(url, w, h, info = {}) {
    const fl = AS.floor(), id = AS.uid('img');
    AS.history.run('Importar referência', () => {
      S.project.assets[id] = url;
      // escala inicial: largura da imagem ≈ 15 m (até calibrar)
      const scale = info.scale || 1500 / w;
      fl.bg = { asset: id, x: 0, y: 0, w, h, scale, opacity: 0.55, visible: true, rot: 0, calibrated: !!info.scale, source: info.source || '', page: info.page || 1, text: info.text || [] , ptScale: info.ptScale || 1 };
    });
    R2.fit();
  },
  calibrate(p1, p2, realCm) {
    const fl = AS.floor(), bg = fl.bg; if (!bg) return;
    const d = AS.geo.dist(p1, p2); if (d < 1) throw new Error('Pontos muito próximos');
    const k = realCm / d;
    AS.history.run('Calibrar escala', () => {
      // escala em torno do primeiro ponto
      bg.x = p1.x + (bg.x - p1.x) * k; bg.y = p1.y + (bg.y - p1.y) * k; bg.scale *= k; bg.calibrated = true;
    });
    R2.fit();
    return bg.scale;
  },
  /**
   * Detecção experimental de paredes em raster: procura faixas escuras horizontais/verticais longas.
   * Retorna candidatos [{a,b,thickness}] em coordenadas da planta.
   */
  async detectWalls(opts = {}) {
    const fl = AS.floor(), bg = fl.bg; if (!bg) throw new Error('Importe uma referência primeiro');
    const img = await this.loadImg(S.project.assets[bg.asset]);
    const maxW = 1400, k = Math.min(1, maxW / img.naturalWidth);
    const W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    g.drawImage(img, 0, 0, W, H);
    const data = g.getImageData(0, 0, W, H).data;
    const thr = opts.threshold ?? 110;
    const dark = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) { const r = data[i * 4], gg = data[i * 4 + 1], b = data[i * 4 + 2]; dark[i] = (0.3 * r + 0.59 * gg + 0.11 * b) < thr ? 1 : 0; }
    const cmPerPx = bg.scale / k; // cm por pixel reduzido
    const minLen = Math.max(8, (opts.minLenCm ?? 60) / cmPerPx);
    const minT = Math.max(2, (opts.minThickCm ?? 8) / cmPerPx), maxT = (opts.maxThickCm ?? 40) / cmPerPx;
    const out = [];
    const scan = (horiz) => {
      const A = horiz ? H : W, B = horiz ? W : H, at = (a, b) => horiz ? dark[a * W + b] : dark[b * W + a];
      // runs por linha
      const runs = [];
      for (let a = 0; a < A; a++) { let s = -1; for (let b = 0; b <= B; b++) { const d = b < B && at(a, b); if (d && s < 0) s = b; if (!d && s >= 0) { if (b - s >= minLen) runs.push({ a, s, e: b }); s = -1; } } }
      // agrupa runs adjacentes sobrepostas em faixas
      const bands = [];
      for (const r of runs) {
        const band = bands.find(bd => bd.a1 === r.a - 1 && Math.min(bd.e, r.e) - Math.max(bd.s, r.s) > minLen * 0.7);
        if (band) { band.a1 = r.a; band.s = Math.round((band.s * band.n + r.s) / (band.n + 1)); band.e = Math.round((band.e * band.n + r.e) / (band.n + 1)); band.n++; }
        else bands.push({ a0: r.a, a1: r.a, s: r.s, e: r.e, n: 1 });
      }
      for (const bd of bands) {
        const t = bd.a1 - bd.a0 + 1; if (t < minT || t > maxT) continue;
        const c = (bd.a0 + bd.a1 + 1) / 2;
        const p = horiz ? [{ x: bd.s, y: c }, { x: bd.e, y: c }] : [{ x: c, y: bd.s }, { x: c, y: bd.e }];
        out.push({ a: p[0], b: p[1], t, horiz });
      }
    };
    scan(true); scan(false);
    // para coordenadas da planta
    const toPlan = (q) => { let x = q.x / k * bg.scale, y = q.y / k * bg.scale; if (bg.rot) { const r = AS.geo.rot({ x, y }, AS.rad(bg.rot)); x = r.x; y = r.y; } return { x: bg.x + x, y: bg.y + y }; };
    let walls = out.map(o => ({ a: toPlan(o.a), b: toPlan(o.b), thickness: Math.round(o.t * cmPerPx), horiz: o.horiz }));
    // estende extremidades até encontrar paredes perpendiculares (fecha cantos)
    for (const w of walls) for (const e of ['a', 'b']) {
      let best = null, bd = 40;
      for (const v of walls) { if (v === w || v.horiz === w.horiz) continue; const pr = AS.geo.projLine(w[e], v.a, v.b); const x = AS.geo.lineInter(w.a, w.b, v.a, v.b); if (!x) continue; const d = AS.geo.dist(x, w[e]); const onV = AS.geo.projSeg(x, v.a, v.b).d < v.thickness; if (d < bd && onV) { bd = d; best = x; } }
      if (best) w[e] = best;
    }
    walls = walls.map(w => ({ ...w, a: { x: AS.round(w.a.x, 1), y: AS.round(w.a.y, 1) }, b: { x: AS.round(w.b.x, 1), y: AS.round(w.b.y, 1) }, thickness: AS.clamp(AS.round(w.thickness, 1), 5, 40) }));
    return walls;
  },
};

/* ---------------- Downloads ---------------- */
AS.download = async (filename, data, mime) => {
  try {
    const dl = await AS.cap('downloads');
    if (dl) {
      const r = await dl.save({ filename, data });
      AS.toast(r.status === 'delivered' ? `Arquivo entregue: ${filename}` : `Arquivo salvo: ${filename}`, 'ok'); return true;
    }
  } catch (e) {
    if (e?.code === 'declined') { AS.toast('Download cancelado'); return false; }
    if (e?.code && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { AS.toast('Não foi possível salvar: ' + (e.message || e.code), 'err'); return false; }
  }
  // Sem a capacidade de download: tenta link direto (funciona fora do visualizador) e mostra prévia
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    AS.ui.showExportFallback(filename, url, mime, typeof data === 'string' ? data : null);
  } catch (e) { AS.toast('Exportação indisponível neste ambiente', 'err'); }
  return false;
};

AS.exporter = {
  slug: () => (S.project.name || 'projeto').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 50) || 'projeto',
  async json(includeAssets = true) {
    const txt = JSON.stringify(AS.serialize(includeAssets), null, 1);
    return AS.download(this.slug() + '.json', txt, 'application/json');
  },
  async png() {
    const cv = R2.renderExport(1.6);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    return AS.download(this.slug() + '-' + AS.floor().name.toLowerCase().replace(/\s+/g, '-') + '.png', blob, 'image/png');
  },
  async png3d() {
    const url = V3.snapshot(); const blob = await (await fetch(url)).blob();
    return AS.download(this.slug() + '-3d.png', blob, 'image/png');
  },
  svgString(fl = AS.floor()) {
    const walls = fl.walls.filter(w => !w.hidden); if (!walls.length) throw new Error('A planta está vazia');
    const b = AS.geo.bbox(walls.flatMap(w => [w.a, w.b])), m = 80;
    const X = (x) => (x - b.x0 + m).toFixed(1), Y = (y) => (y - b.y0 + m).toFixed(1);
    const W = b.w + m * 2, H = b.h + m * 2 + 40;
    const pts = (poly) => poly.map(p => X(p.x) + ',' + Y(p.y)).join(' ');
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="${(W / 100).toFixed(2)}m" height="${(H / 100).toFixed(2)}m" font-family="Archivo, Helvetica, Arial, sans-serif">\n<title>${AS.esc(S.project.name)} — ${AS.esc(fl.name)}</title>\n<desc>Unidades: 1 unidade do SVG = 1 cm. Gerado por Architect Studio Ultra.</desc>\n<rect width="100%" height="100%" fill="#fff"/>\n<g id="comodos">`;
    const { rooms } = AS.rooms(fl);
    for (const r of rooms) s += `\n<polygon points="${pts(r.inner)}" fill="${r.meta?.color || AS.roomType(r.meta?.type).color}" data-name="${AS.esc(AS.roomName(r))}" data-area-m2="${(r.area / 1e4).toFixed(2)}"/>`;
    s += '\n</g>\n<g id="moveis" fill="none" stroke="#777" stroke-width="1">';
    for (const f of fl.furniture) if (!f.hidden) s += `\n<rect x="${X(f.x - f.w / 2)}" y="${Y(f.y - f.d / 2)}" width="${f.w}" height="${f.d}" rx="3" transform="rotate(${f.rot || 0} ${X(f.x)} ${Y(f.y)})"><title>${AS.esc(f.name)}</title></rect>`;
    s += '\n</g>\n<g id="paredes" stroke="#1b1d22" stroke-width="2">';
    for (const w of walls) { const e = R2.wallExt(w, fl); s += `\n<polygon points="${pts(R2.wallPoly(w, e.a, e.b))}" fill="${w.type === 'exterior' ? '#3a3d44' : '#6b6f78'}" data-id="${w.id}" data-length-cm="${AS.wallLen(w).toFixed(1)}" data-thickness-cm="${w.thickness}"/>`; }
    s += '\n</g>\n<g id="paredes-preenchimento" stroke="none">';
    for (const w of walls) { const e = R2.wallExt(w, fl); s += `\n<polygon points="${pts(R2.wallPoly(w, e.a, e.b))}" fill="${w.type === 'exterior' ? '#3a3d44' : '#6b6f78'}"/>`; }
    s += '\n</g>\n<g id="aberturas" stroke="#1b1d22" stroke-width="1.2" fill="none">';
    for (const o of fl.openings) {
      const w = fl.walls.find(x => x.id === o.wallId); if (!w || o.hidden) continue;
      const g = R2.openingGeom(o, w), h = w.thickness / 2 + 0.6;
      const cut = [AS.geo.add(g.p0, AS.geo.mul(g.n, h)), AS.geo.add(g.p1, AS.geo.mul(g.n, h)), AS.geo.sub(g.p1, AS.geo.mul(g.n, h)), AS.geo.sub(g.p0, AS.geo.mul(g.n, h))];
      s += `\n<polygon points="${pts(cut)}" fill="#fff" stroke="none"/>`;
      if (o.kind === 'window') { for (const k of [-0.5, 0.5]) { const A = AS.geo.add(g.p0, AS.geo.mul(g.n, h * k)), B = AS.geo.add(g.p1, AS.geo.mul(g.n, h * k)); s += `<line x1="${X(A.x)}" y1="${Y(A.y)}" x2="${X(B.x)}" y2="${Y(B.y)}"/>`; } }
      else if (o.type === 'giro' || o.type === 'dupla') {
        const nn = AS.geo.mul(g.n, o.side || 1), hp = o.hinge === 'b' ? g.p1 : g.p0, op = o.hinge === 'b' ? g.p0 : g.p1;
        const f0 = AS.geo.add(hp, AS.geo.mul(nn, h)), tip = AS.geo.add(f0, AS.geo.mul(nn, o.width)), end = AS.geo.add(op, AS.geo.mul(nn, h));
        const sweep = AS.geo.cross(AS.geo.sub(tip, f0), AS.geo.sub(end, f0)) > 0 ? 1 : 0;
        s += `<line x1="${X(f0.x)}" y1="${Y(f0.y)}" x2="${X(tip.x)}" y2="${Y(tip.y)}" stroke-width="2"/><path d="M${X(tip.x)} ${Y(tip.y)} A${o.width} ${o.width} 0 0 ${sweep} ${X(end.x)} ${Y(end.y)}" stroke-dasharray="3 3"/>`;
      } else s += `<line x1="${X(g.p0.x)}" y1="${Y(g.p0.y)}" x2="${X(g.p1.x)}" y2="${Y(g.p1.y)}" stroke-dasharray="4 3"/>`;
    }
    s += '\n</g>\n<g id="cotas" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5a5f6a" text-anchor="middle">';
    for (const w of walls) { const L = AS.wallLen(w); if (L < 40) continue; const mid = AS.geo.lerp(w.a, w.b, 0.5), n = AS.geo.perp(AS.wallDir(w)), q = AS.geo.add(mid, AS.geo.mul(n, w.thickness / 2 + 14)); let ang = AS.deg(Math.atan2(w.b.y - w.a.y, w.b.x - w.a.x)); if (ang > 90 || ang < -90) ang += 180; s += `\n<text x="${X(q.x)}" y="${Y(q.y)}" transform="rotate(${ang.toFixed(1)} ${X(q.x)} ${Y(q.y)})">${AS.units.fmt(L)}</text>`; }
    for (const d of fl.dims) { s += `\n<line x1="${X(d.a.x)}" y1="${Y(d.a.y)}" x2="${X(d.b.x)}" y2="${Y(d.b.y)}" stroke="#1f5fbf"/><text x="${X((d.a.x + d.b.x) / 2)}" y="${Y((d.a.y + d.b.y) / 2) - 4}" fill="#1f5fbf">${AS.units.fmt(AS.geo.dist(d.a, d.b))}</text>`; }
    s += '\n</g>\n<g id="rotulos" text-anchor="middle">';
    for (const r of rooms) s += `\n<text x="${X(r.label.x)}" y="${Y(r.label.y)}" font-size="14" font-weight="600" fill="#14161a">${AS.esc(AS.roomName(r).toUpperCase())}</text><text x="${X(r.label.x)}" y="${(+Y(r.label.y) + 16).toFixed(1)}" font-size="11" fill="#4a4f59" font-family="IBM Plex Mono, monospace">${AS.units.fmtArea(r.area)}</text>`;
    s += `\n</g>\n<text x="${m}" y="${(H - 16).toFixed(0)}" font-size="13" fill="#14161a">${AS.esc(S.project.name)} — ${AS.esc(fl.name)} · área útil ${AS.units.fmtArea(rooms.reduce((a, r) => a + r.area, 0))}</text>\n<rect x="${(W - m - 100).toFixed(0)}" y="${(H - 26).toFixed(0)}" width="100" height="4" fill="#14161a"/><text x="${(W - m + 8).toFixed(0)}" y="${(H - 20).toFixed(0)}" font-size="11">1 m</text>\n</svg>`;
    return s;
  },
  async svg() { return AS.download(this.slug() + '.svg', this.svgString(), 'image/svg+xml'); },
  async pdf() {
    const J = window.jspdf?.jsPDF; if (!J) throw new Error('Biblioteca jsPDF não carregou (sem acesso à CDN). Use PNG ou SVG.');
    const doc = new J({ orientation: 'landscape', unit: 'mm', format: 'a3' });
    const PW = 420, PH = 297, M = 12;
    S.project.floors.forEach((fl, i) => {
      if (!fl.walls.length) return;
      if (i > 0 && doc.getNumberOfPages() >= 1 && doc.__used) doc.addPage('a3', 'landscape');
      doc.__used = true;
      const cv = R2.renderExport(1.4, fl, 60);
      const ratio = Math.min((PW - M * 2) / cv.width, (PH - M * 2 - 34) / cv.height);
      doc.addImage(cv.toDataURL('image/png'), 'PNG', M, M, cv.width * ratio, cv.height * ratio);
      // escala real aproximada: 1.4 px/cm => ratio mm/px => mm por cm
      const mmPerCm = 1.4 * ratio, scaleDen = Math.round(10 / mmPerCm);
      const y = PH - M - 28;
      doc.setDrawColor(30); doc.rect(M, y, PW - M * 2, 28);
      doc.setFontSize(14); doc.text(`${S.project.name}`, M + 4, y + 8);
      doc.setFontSize(9);
      const met = AS.metrics(fl);
      doc.text(`Pavimento: ${fl.name}  ·  Área útil: ${AS.units.fmtArea(met.util)}  ·  Área construída aprox.: ${AS.units.fmtArea(met.built)}  ·  Escala aprox. 1:${scaleDen} em A3`, M + 4, y + 15);
      const rooms = AS.rooms(fl).rooms.map(r => `${AS.roomName(r)} ${AS.units.fmtArea(r.area)}`).join('  ·  ');
      doc.text(doc.splitTextToSize(rooms, PW - M * 2 - 8).slice(0, 2), M + 4, y + 21);
      doc.setFontSize(7); doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')} · Architect Studio Ultra · Estudo — não substitui projeto técnico assinado`, PW - M - 4, y + 26, { align: 'right' });
    });
    if (V3.ok) { try { const img = V3.snapshot(); doc.addPage('a3', 'landscape'); const c = V3.renderer.domElement; const r = Math.min((PW - M * 2) / c.width, (PH - M * 2) / c.height); doc.addImage(img, 'PNG', M, M, c.width * r, c.height * r); doc.setFontSize(10); doc.text('Vista 3D', M, PH - 6); } catch (e) { } }
    const blob = doc.output('blob');
    return AS.download(this.slug() + '.pdf', blob, 'application/pdf');
  },
};

/* ---------------- Capacidades do Artifact ---------------- */
AS._caps = {};
AS.cap = (name) => {
  if (!(name in AS._caps)) AS._caps[name] = (async () => { try { return window.claude?.use ? await window.claude.use(name) : null; } catch (e) { return null; } })();
  return AS._caps[name];
};

/* ---------------- Armazenamento ---------------- */
AS.storage = {
  mode: 'local', uid: null, db: null, ready: false,
  LS_INDEX: 'asu.projects.index', LS_PREFIX: 'asu.project.',
  ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return v === undefined ? null : false; } },
  async init() {
    const [db, user] = await Promise.all([AS.cap('db'), AS.cap('user')]);
    if (db && user) {
      try { const id = await user.id(); if (id) { this.db = db; this.uid = id; this.mode = 'db'; } } catch (e) { }
    }
    this.ready = true; AS.bus.emit('storage');
  },
  col() { return this.db.collection('data/users/' + this.uid + '/projects'); },
  async list() {
    const out = new Map();
    try { const idx = JSON.parse(this.ls(this.LS_INDEX) || '[]'); for (const p of idx) out.set(p.id, { ...p, where: 'local' }); } catch (e) { }
    if (this.mode === 'db') {
      try { const snap = await this.col().get(); for (const d of snap.docs) { const v = d.data(); out.set(d.id, { id: d.id, name: v.name, modified: v.modified, created: v.created, where: 'nuvem' }); } }
      catch (e) { console.warn('db list', e); }
    }
    return [...out.values()].sort((a, b) => (b.modified || 0) - (a.modified || 0));
  },
  async save(p) {
    const full = JSON.stringify(AS.serialize(true));
    const lean = JSON.stringify(AS.serialize(false));
    const results = [];
    if (this.mode === 'db') {
      try { await this.col().doc(p.id).set({ name: p.name, modified: p.modified || Date.now(), created: p.created, json: full.length < 900000 ? full : lean, hasAssets: full.length < 900000 }); results.push('nuvem'); }
      catch (e) {
        try { await this.col().doc(p.id).set({ name: p.name, modified: p.modified || Date.now(), created: p.created, json: lean, hasAssets: false }); results.push('nuvem (sem imagens de referência)'); }
        catch (e2) { console.warn('db save', e2); }
      }
    }
    let ok = this.ls(this.LS_PREFIX + p.id, full);
    if (!ok) ok = this.ls(this.LS_PREFIX + p.id, lean) && 'lean';
    if (ok) {
      results.push(ok === 'lean' ? 'navegador (sem imagens)' : 'navegador');
      try { const idx = JSON.parse(this.ls(this.LS_INDEX) || '[]').filter(x => x.id !== p.id); idx.push({ id: p.id, name: p.name, modified: p.modified, created: p.created }); this.ls(this.LS_INDEX, JSON.stringify(idx)); } catch (e) { }
    }
    if (!results.length) throw new Error('Nenhum armazenamento disponível. Use Exportar → JSON para guardar o projeto.');
    return results;
  },
  async load(id) {
    if (this.mode === 'db') { try { const d = await this.col().doc(id).get(); if (d.exists) return JSON.parse(d.data().json); } catch (e) { console.warn('db load', e); } }
    const s = this.ls(this.LS_PREFIX + id); if (s) return JSON.parse(s);
    throw new Error('Projeto não encontrado no armazenamento');
  },
  async remove(id) {
    if (this.mode === 'db') { try { await this.col().doc(id).delete(); } catch (e) { } }
    this.ls(this.LS_PREFIX + id, null);
    try { const idx = JSON.parse(this.ls(this.LS_INDEX) || '[]').filter(x => x.id !== id); this.ls(this.LS_INDEX, JSON.stringify(idx)); } catch (e) { }
  },
  async saveCurrent(verbose = false) {
    try {
      S.project.modified = Date.now();
      const where = await this.save(S.project);
      AS.lastSaved = { ts: Date.now(), where };
      AS.bus.emit('saved', where);
      if (verbose) AS.toast('Projeto salvo: ' + where.join(' + '), 'ok');
      return true;
    } catch (e) { AS.toast(e.message, 'err'); AS.bus.emit('saved', null); return false; }
  },
};

AS.toast = (msg, kind = '') => {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.setAttribute('role', 'status'); el.textContent = msg;
  box.appendChild(el); setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, kind === 'err' ? 5200 : 2600);
  while (box.children.length > 4) box.firstChild.remove();
};

/* ---------- modal ---------- */
UI.modal = (title, html, actions = [], opts = {}) => {
  const m = $('#modal'); m.hidden = false; m.className = 'modal ' + (opts.wide ? 'wide' : '');
  $('#modalTitle').textContent = title; $('#modalBody').innerHTML = html;
  const foot = $('#modalFoot'); foot.innerHTML = '';
  for (const a of actions) { const b = document.createElement('button'); b.className = 'btn ' + (a.kind || ''); b.textContent = a.label; b.onclick = async () => { const r = await a.fn?.(); if (r !== false) UI.closeModal(); }; foot.appendChild(b); }
  setTimeout(() => ($('#modalBody input, #modalBody select, #modalBody textarea') || foot.querySelector('.primary') || foot.lastChild)?.focus(), 30);
};
UI.closeModal = () => { $('#modal').hidden = true; };
UI.confirm = (title, msg, okLabel, fn, danger = true) => UI.modal(title, `<p class="mtext">${msg}</p>`, [{ label: 'Cancelar' }, { label: okLabel, kind: danger ? 'danger' : 'primary', fn }]);

/* ---------- menu de contexto ---------- */
UI.contextMenu = (x, y, items) => {
  const m = $('#ctxmenu'); m.innerHTML = '';
  for (const it of items) {
    if (it.sep) { if (m.lastChild && !m.lastChild.classList.contains('sep')) m.insertAdjacentHTML('beforeend', '<div class="sep" role="separator"></div>'); continue; }
    const b = document.createElement('button'); b.className = 'ctx-item' + (it.danger ? ' danger' : ''); b.setAttribute('role', 'menuitem');
    b.innerHTML = `<span>${esc(it.label)}</span>${it.key ? `<kbd>${esc(it.key)}</kbd>` : ''}`;
    b.onclick = () => { UI.hideCtx(); it.fn(); }; m.appendChild(b);
  }
  if (m.lastChild?.classList.contains('sep')) m.lastChild.remove();
  m.hidden = false;
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px'; m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  m.querySelector('button')?.focus();
};

UI.bind = (root, map) => {

    el.addEventListener(ev, () => {

      if (el.dataset.len) { v = AS.units.parse(v); if (!isFinite(v) || v <= 0) { AS.toast('Valor inválido. Exemplos: 3,5 · 350cm · 3m50', 'err'); UI.renderProps(); return; } }
      else if (el.type === 'number') { v = parseFloat(v); if (!isFinite(v)) { UI.renderProps(); return; } }
      fn(v, el);
    });
    if (el.tagName === 'INPUT' && el.type !== 'checkbox') el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });

};

UI.applyMaterial = (id) => {
  const sel = AS.editor.selected(); if (!sel.length) return AS.toast('Selecione paredes, cômodos, móveis ou aberturas para aplicar o material');
  AS.history.run('Aplicar material', () => {
    for (const s of sel) {
      if (s.kind === 'wall') s.o.material = id;
      if (s.kind === 'room') s.o.floorMaterial = id;
      if (s.kind === 'furniture') s.o.material = id;
      if (s.kind === 'opening') { if (AS.mat(id).cat === 'Vidro' || AS.mat(id).cat === 'Madeira') s.o.material = id; else s.o.frame = id; }
    }
  });
  AS.toast(`${AS.mat(id).name} aplicado a ${sel.length} objeto(s)`);
};
UI.editMaterial = (id) => {
  const m = S.project.materials.find(x => x.id === id); const box = $('#matEdit'); if (!m || !box) return;
  box.innerHTML = `<h4>Editar: ${esc(m.name)}</h4><div class="grid2">${F.color('meC', 'Cor', m.color)}${F.num('meR', 'Rugosidade', m.rough, '0–1', 0.05)}${F.num('meM', 'Metal', m.metal || 0, '0–1', 0.05)}${F.sel('meP', 'Padrão', ['none', 'wood', 'tile', 'brick', 'concrete', 'stone', 'marble', 'glass', 'metal'].map(v => ({ v, l: { none: 'Liso', wood: 'Madeira', tile: 'Placas', brick: 'Tijolo/metrô', concrete: 'Concreto', stone: 'Pedra', marble: 'Mármore', glass: 'Vidro', metal: 'Metal' }[v] })), m.pattern)}</div>${F.txt('meN', 'Nome', m.name)}`;

};

UI.addFloor = (mode) => {
  const p = S.project, cur = AS.floor();
  AS.history.run('Adicionar pavimento', () => {
    let f;
    if (mode === 'dup') { f = AS.clone(cur); f.id = AS.uid('fl'); f.name = cur.name + ' (cópia)'; const map = {}; f.walls.forEach(w => { const n = AS.uid('w'); map[w.id] = n; w.id = n; }); f.openings.forEach(o => { o.id = AS.uid('op'); o.wallId = map[o.wallId]; }); f.furniture.forEach(x => x.id = AS.uid('fu')); f.roomMeta.forEach(x => x.id = AS.uid('rm')); f.dims.forEach(x => x.id = AS.uid('dm')); const top = Math.max(...p.floors.map(x => x.elevation || 0)); f.elevation = top + (cur.height || 280) + (cur.slab || 12); p.floors.push(f); }
    else if (mode === 'up') { const top = p.floors.reduce((a, b) => (b.elevation || 0) > (a.elevation || 0) ? b : a, p.floors[0]); f = AS.newFloor(p.floors.length === 1 ? 'Pavimento superior' : `Pavimento ${p.floors.length + 1}`, (top.elevation || 0) + (top.height || 280) + (top.slab || 12)); p.floors.push(f); }
    else { const low = Math.min(...p.floors.map(x => x.elevation || 0)); f = AS.newFloor('Subsolo', low - 292); p.floors.unshift(f); }
    p.activeFloor = f.id; if (mode !== 'dup') S.project.settings.showLower = true;
  });
  AS.bus.emit('floor'); AS.toast('Pavimento adicionado: ' + AS.floor().name);
};

UI.importJsonFile = async (file) => {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text()), errs = AS.validateProjectData(d);
    if (errs.length) throw new Error('Arquivo inválido: ' + errs.slice(0, 3).join('; '));
    const p = AS.normalizeProject(d);
    if (S.project.id === p.id) p.id = AS.uid('prj');
    AS.loadProject(p); AS.toast('Projeto importado: ' + p.name, 'ok');
  } catch (e) { AS.toast(e.message.startsWith('Arquivo') ? e.message : 'Não foi possível ler o JSON: ' + e.message, 'err'); }
};

AS.importUI = {
  result: null, page: 1, candidates: null,
  render(el) {
    const fl = AS.floor(), bg = fl.bg, imp = AS.importer, r = this.result;
    const dimRe = /^(\d{1,2}[.,]\d{2}|\d{2,4})$/;
    const roomRe = new RegExp('^(' + ['sala', 'estar', 'jantar', 'cozinha', 'copa', 'quarto', 'dormit', 'suite', 'suíte', 'banho', 'banheiro', 'wc', 'lavabo', 'lavand', 'área de serviço', 'a\\. serv', 'garagem', 'abrigo', 'circula', 'hall', 'corredor', 'varanda', 'sacada', 'terraço', 'escrit', 'depósito', 'despensa', 'closet', 'escada', 'gourmet', 'churrasq'].join('|') + ')', 'i');
    let html = `<div class="sec callout ${S.project.meta?.source === 'pdf' ? 'ok' : 'warn'}">${icon(S.project.meta?.source === 'pdf' ? 'check' : 'warn')}<div><b>PDF da sua casa</b><br>${S.project.meta?.source === 'pdf' ? 'Reconstrução em andamento a partir de: ' + esc(S.project.meta.file || 'PDF importado') : 'Não foi recebido nenhum PDF nesta conversa, então a casa ainda não foi reconstruída. Carregue o arquivo aqui para importar a planta.'}</div></div>

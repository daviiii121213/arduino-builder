[package]
name = "plu-core"
version = "1.0.0"
edition = "2021"
description = "PERSONAL LIFE ULTRA - núcleo local (SQLite, autenticação, permissões, módulos, backup, relatórios)"
license = "MIT"

[lib]
name = "plu_core"
path = "src/lib.rs"

[[bin]]
name = "plu-devserver"
path = "src/bin/devserver.rs"
required-features = ["devserver"]

[features]
default = []
devserver = ["dep:tiny_http"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
rust_xlsxwriter = "0.79"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
unicode-normalization = "0.1"
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"

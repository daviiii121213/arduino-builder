[package]
name = "plu-wasm"
version = "1.0.0"
edition = "2021"
description = "PERSONAL LIFE ULTRA - núcleo compilado para WebAssembly (versão web de demonstração)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
plu-core = { path = "../plu-core" }
wasm-bindgen = "=0.2.130"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

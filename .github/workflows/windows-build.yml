name: Windows build

on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/plu-core
      - name: Instalar dependências
        run: npm ci
      - name: Testes do núcleo (Windows)
        run: cargo test --manifest-path crates/plu-core/Cargo.toml
      - name: Verificação de tipos
        run: npx tsc --noEmit
      - name: Compilar aplicativo e instalador
        run: npx tauri build
      - name: Teste de inicialização do executável
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/PersonalLifeUltra.exe"
          if (!(Test-Path $exe)) { throw "Executável não gerado" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "O aplicativo encerrou na inicialização (código $($p.ExitCode))" }
          $db = Join-Path $env:APPDATA "com.personallifeultra.app/plu.db"
          if (!(Test-Path $db)) { throw "Banco local não foi criado em $db" }
          Write-Host "OK: app iniciou e criou $db"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalLifeUltra-windows
          path: |
            src-tauri/target/release/PersonalLifeUltra.exe
            src-tauri/target/release/bundle/nsis/*.exe
